<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes"/>
    <title>Settings | AdminPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* Same compact styles as other files */
        :root {
            --primary: #6C5CE7; --primary-dark: #5A3FD9; --primary-light: #A29BFE;
            --primary-glow: rgba(108,92,231,0.25);
            --secondary: #00D2D3; --secondary-light: #55EFC4;
            --success: #00B894; --warning: #FDCB6E; --danger: #FF6B6B;
            --dark: #0a0a1a; --dark-card: #12122a; --bg: #080816;
            --gray: #6c7a89; --gray-light: #a0aec0; --white: #ffffff;
            --radius: 16px; --radius-sm: 10px; --radius-xs: 6px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --shadow-glow: 0 8px 32px rgba(108,92,231,0.2);
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            --border-glow: 1px solid rgba(108,92,231,0.12);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--white);
            line-height: 1.5; min-height: 100vh;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(ellipse at 20% 30%, rgba(108,92,231,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 70%, rgba(0,210,211,0.06) 0%, transparent 50%);
            z-index: -1;
            animation: bgFloat 15s ease-in-out infinite alternate;
        }
        @keyframes bgFloat {
            0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.1) rotate(3deg); opacity: 1; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 14px; }

        /* HEADER */
        .header {
            background: rgba(10,10,26,0.92); backdrop-filter: blur(16px);
            padding: 8px 0; position: fixed; top: 0; left: 0; right: 0;
            z-index: 1000; border-bottom: var(--border-glow);
        }
        .header .container { display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .brand-icon {
            width: 36px; height: 36px; border-radius: var(--radius-xs);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: var(--white);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .brand h1 {
            font-size: 16px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .btn-icon {
            width: 34px; height: 34px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.04); color: var(--gray-light);
            cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        .btn-icon:hover { background: var(--primary); color: var(--white); transform: scale(1.05); }
        .avatar {
            width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--primary); cursor: pointer; transition: var(--transition);
        }
        .avatar:hover { transform: scale(1.06); border-color: var(--secondary); }
        .sidebar-toggle {
            display: none; width: 34px; height: 34px; border-radius: var(--radius-xs);
            border: none; background: rgba(255,255,255,0.04); color: var(--white);
            cursor: pointer; transition: var(--transition); font-size: 16px;
        }
        .sidebar-toggle:hover { background: var(--primary); }

        /* SIDEBAR */
        .sidebar {
            position: fixed; top: 54px; left: 0; bottom: 0; width: 200px;
            background: rgba(10,10,26,0.94); backdrop-filter: blur(16px);
            border-right: var(--border-glow); padding: 12px 0;
            transition: var(--transition); z-index: 900; overflow-y: auto;
        }
        .sidebar-menu { list-style: none; padding: 0 10px; }
        .menu-label {
            font-size: 9px; font-weight: 700; color: var(--gray);
            text-transform: uppercase; letter-spacing: 1px;
            padding: 10px 12px 4px; opacity: 0.5;
        }
        .sidebar-item { margin-bottom: 1px; }
        .sidebar-link {
            display: flex; align-items: center; gap: 10px;
            padding: 8px 12px; border-radius: var(--radius-xs);
            color: var(--gray-light); text-decoration: none;
            font-weight: 500; font-size: 12px;
            transition: var(--transition); position: relative;
        }
        .sidebar-link i { width: 18px; font-size: 14px; text-align: center; }
        .sidebar-link:hover { background: rgba(108,92,231,0.08); color: var(--white); }
        .sidebar-link.active {
            background: rgba(108,92,231,0.12); color: var(--white); font-weight: 600;
        }
        .sidebar-link.active::before {
            content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
            width: 3px; background: var(--primary); border-radius: 0 3px 3px 0;
        }

        /* MAIN */
        .main-content {
            margin-top: 54px; margin-left: 200px;
            padding: 16px 14px 40px;
            transition: var(--transition); min-height: 100vh;
        }

        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
        }
        .page-header h1 {
            font-size: 20px; font-weight: 800;
            display: flex; align-items: center; gap: 10px;
        }
        .page-header h1 i {
            color: var(--primary); background: rgba(108,92,231,0.1);
            padding: 8px; border-radius: var(--radius-xs); font-size: 16px;
        }
        .page-header p { color: var(--gray); font-size: 12px; margin-left: 42px; }

        .settings-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        @media (max-width: 992px) { .settings-grid { grid-template-columns: 1fr; } }

        .card {
            background: var(--dark-card); border-radius: var(--radius-sm);
            padding: 18px 20px; border: var(--border-glow);
            transition: var(--transition);
        }
        .card:hover { border-color: rgba(108,92,231,0.2); }
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
        .card-title i { color: var(--primary); }
        .card-desc { color: var(--gray); font-size: 12px; margin-bottom: 16px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-weight: 600; font-size: 12px; margin-bottom: 4px; color: var(--white); }
        .form-control {
            width: 100%; padding: 8px 12px;
            border: 1px solid rgba(255,255,255,0.06); border-radius: var(--radius-xs);
            font-size: 13px; font-family: 'Inter', sans-serif;
            transition: var(--transition); background: rgba(255,255,255,0.03);
            color: var(--white);
        }
        .form-control:focus {
            border-color: var(--primary); outline: none;
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 20px var(--primary-glow);
        }

        .toggle-wrapper {
            display: flex; align-items: center; gap: 14px;
            padding: 8px 0;
        }
        .toggle {
            position: relative; width: 48px; height: 26px;
            background: var(--gray); border-radius: 20px;
            cursor: pointer; transition: var(--transition);
            flex-shrink: 0;
        }
        .toggle.active { background: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
        .toggle .toggle-knob {
            position: absolute; top: 2px; left: 2px;
            width: 22px; height: 22px;
            background: var(--white); border-radius: 50%;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .toggle.active .toggle-knob { left: 24px; }
        .toggle-label { font-weight: 600; font-size: 14px; color: var(--white); }
        .toggle-status { font-size: 12px; color: var(--gray); font-weight: 500; }
        .toggle-status .on { color: var(--secondary-light); }
        .toggle-status .off { color: var(--danger); }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 9px 18px; border-radius: var(--radius-xs);
            font-weight: 600; font-size: 12px; border: none;
            cursor: pointer; transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white); box-shadow: 0 0 20px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px var(--primary-glow); }
        .btn-block { width: 100%; justify-content: center; }

        .form-result {
            margin-top: 12px; padding: 10px 14px; border-radius: var(--radius-xs);
            font-weight: 500; font-size: 13px; text-align: center;
            display: none;
        }
        .form-result.success { display: block; background: rgba(0,210,211,0.1); color: var(--secondary-light); border: 1px solid rgba(0,210,211,0.15); }
        .form-result.error { display: block; background: rgba(255,107,107,0.1); color: var(--danger); border: 1px solid rgba(255,107,107,0.15); }

        #toastContainer {
            position: fixed; bottom: 16px; right: 16px;
            z-index: 9999; display: flex; flex-direction: column; gap: 8px;
            max-width: 340px; width: 100%;
        }
        .toast {
            padding: 10px 16px; border-radius: var(--radius-xs);
            color: var(--white); font-weight: 500; font-size: 13px;
            box-shadow: var(--shadow); animation: slideUp 0.3s ease forwards;
            display: flex; align-items: center; gap: 10px;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 992px) {
            .sidebar-toggle { display: flex; }
            .sidebar { transform: translateX(-100%); width: 220px; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
        }
        @media (max-width: 600px) {
            .brand h1 { font-size: 14px; }
            .brand-icon { width: 30px; height: 30px; font-size: 13px; }
            .page-header h1 { font-size: 17px; }
            .card { padding: 14px; }
            .settings-grid { gap: 12px; }
            .header-actions .btn-icon:not(.avatar):not(.sidebar-toggle) { display: none; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="index.html" class="brand">
                    <div class="brand-icon"><i class="fas fa-crown"></i></div>
                    <h1>AdminPro</h1>
                </a>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i>
                </button>
                <img src="logo.png" alt="Admin" class="avatar" />
            </div>
        </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <ul class="sidebar-menu">
            <li class="menu-label">Main</li>
            <li class="sidebar-item">
                <a href="index.html" class="sidebar-link">
                    <i class="fas fa-chart-pie"></i> Dashboard
                </a>
            </li>
            <li class="sidebar-item">
                <a href="admin.html" class="sidebar-link">
                    <i class="fas fa-user-plus"></i> Add User
                </a>
            </li>
            <li class="sidebar-item">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="fas fa-users-cog"></i> Manage Users
                </a>
            </li>
            <li class="menu-label">System</li>
            <li class="sidebar-item">
                <a href="settings.html" class="sidebar-link active">
                    <i class="fas fa-sliders-h"></i> Settings
                </a>
            </li>
        </ul>
    </aside>

    <!-- ===== OVERLAY ===== -->
    <div class="overlay" id="overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:940;display:none;backdrop-filter:blur(4px);"></div>

    <!-- ===== MAIN ===== -->
    <main class="main-content" id="mainContent">
        <div class="container">

            <div class="page-header">
                <div>
                    <h1><i class="fas fa-sliders-h"></i> Settings</h1>
                    <p>Configure system settings</p>
                </div>
            </div>

            <div class="settings-grid">

                <div class="card">
                    <h2 class="card-title"><i class="fas fa-tools"></i> Maintenance Mode</h2>
                    <p class="card-desc">Enable to restrict access during updates.</p>

                    <div class="toggle-wrapper">
                        <div class="toggle" id="maintenanceToggle">
                            <div class="toggle-knob"></div>
                        </div>
                        <div>
                            <div class="toggle-label">Maintenance Mode</div>
                            <div class="toggle-status" id="maintenanceStatus">
                                Status: <span class="off">Off</span>
                            </div>
                        </div>
                    </div>

                    <div id="maintenanceResult" class="form-result"></div>
                </div>

                <div class="card">
                    <h2 class="card-title"><i class="fas fa-cog"></i> App Settings</h2>
                    <p class="card-desc">Update version, message, and link.</p>

                    <div class="form-group">
                        <label>Version</label>
                        <input type="text" id="versionInput" class="form-control" placeholder="e.g., 2.1.0" />
                    </div>

                    <div class="form-group">
                        <label>Message</label>
                        <input type="text" id="messageInput" class="form-control" placeholder="Welcome message" />
                    </div>

                    <div class="form-group">
                        <label>Link</label>
                        <input type="text" id="linkInput" class="form-control" placeholder="https://example.com" />
                    </div>

                    <button class="btn btn-primary btn-block" id="saveSettingsBtn">
                        <i class="fas fa-save"></i> Save Settings
                    </button>

                    <div id="settingsResult" class="form-result"></div>
                </div>

            </div>

        </div>
    </main>

    <div id="toastContainer"></div>

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, onValue, update } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

        // ---- Sidebar ----
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.style.display = sidebar.classList.contains('open') ? 'block' : 'none';
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.style.display = 'none';
        });

        // ---- Toast ----
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;color:inherit;cursor:pointer;font-size:14px;opacity:0.7;margin-left:auto;">✕</button>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
        window.showToast = showToast;

        // ---- DOM Refs ----
        const maintenanceToggle = document.getElementById('maintenanceToggle');
        const maintenanceStatus = document.getElementById('maintenanceStatus');
        const maintenanceResult = document.getElementById('maintenanceResult');
        const versionInput = document.getElementById('versionInput');
        const messageInput = document.getElementById('messageInput');
        const linkInput = document.getElementById('linkInput');
        const saveSettingsBtn = document.getElementById('saveSettingsBtn');
        const settingsResult = document.getElementById('settingsResult');

        const appUpdateRef = ref(db, 'settings/appupdate');

        // ---- Load ----
        onValue(appUpdateRef, (snapshot) => {
            const settings = snapshot.val();
            if (settings) {
                const isOn = settings.maintenanceMode === 'true';
                maintenanceToggle.classList.toggle('active', isOn);
                updateMaintenanceStatus(isOn);
                versionInput.value = settings.version || '';
                messageInput.value = settings.message || '';
                linkInput.value = settings.link || '';
            }
        });

        // ---- Toggle ----
        maintenanceToggle.addEventListener('click', () => {
            const isCurrentlyOn = maintenanceToggle.classList.contains('active');
            const newState = !isCurrentlyOn;
            update(appUpdateRef, { maintenanceMode: newState ? 'true' : 'false' })
                .then(() => {
                    maintenanceToggle.classList.toggle('active', newState);
                    updateMaintenanceStatus(newState);
                    showResult(maintenanceResult, `✅ Maintenance ${newState ? 'enabled' : 'disabled'}!`, 'success');
                    showToast(`🔧 Maintenance ${newState ? 'enabled' : 'disabled'}`, 'info');
                })
                .catch((error) => showResult(maintenanceResult, '❌ Error: ' + error.message, 'error'));
        });

        function updateMaintenanceStatus(isOn) {
            maintenanceStatus.innerHTML = `Status: <span class="${isOn ? 'on' : 'off'}">${isOn ? 'On' : 'Off'}</span>`;
        }

        // ---- Save ----
        saveSettingsBtn.addEventListener('click', () => {
            const settings = {
                version: versionInput.value.trim(),
                message: messageInput.value.trim(),
                link: linkInput.value.trim(),
                maintenanceMode: maintenanceToggle.classList.contains('active') ? 'true' : 'false'
            };

            update(appUpdateRef, settings)
                .then(() => {
                    showResult(settingsResult, '✅ Settings saved!', 'success');
                    showToast('✅ Settings saved successfully!', 'success');
                })
                .catch((error) => showResult(settingsResult, '❌ Error: ' + error.message, 'error'));
        });

        function showResult(element, message, type) {
            element.textContent = message;
            element.className = `form-result ${type}`;
            setTimeout(() => {
                element.textContent = '';
                element.className = 'form-result';
            }, 4000);
        }
    </script>

</body>
</html>
