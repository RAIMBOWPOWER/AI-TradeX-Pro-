<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manage Users | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== SAME STYLES AS INDEX.HTML ===== */
        :root {
            --primary: #6C5CE7; --primary-dark: #5A3FD9; --primary-light: #A29BFE;
            --primary-glow: rgba(108, 92, 231, 0.3);
            --secondary: #00D2D3; --secondary-light: #55EFC4;
            --secondary-glow: rgba(0, 210, 211, 0.3);
            --success: #00B894; --danger: #FF6B6B; --warning: #FDCB6E;
            --dark: #1a1a2e; --dark-card: #16213e; --gray: #b2bec3;
            --white: #ffffff; --bg: #0f0f1a;
            --card-bg: rgba(22, 33, 62, 0.85);
            --shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 20px 60px rgba(108, 92, 231, 0.25);
            --radius: 20px; --radius-sm: 12px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --border-glow: 1px solid rgba(108, 92, 231, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg); color: var(--white);
            line-height: 1.6; overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background: 
                radial-gradient(ellipse at 10% 20%, rgba(108, 92, 231, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(0, 210, 211, 0.1) 0%, transparent 50%);
            z-index: -1;
            animation: bgPulse 10s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 10px;
        }

        .container { max-width: 1320px; margin: 0 auto; padding: 0 24px; }

        /* HEADER */
        .header {
            background: rgba(26, 26, 46, 0.85);
            backdrop-filter: blur(20px);
            padding: 12px 0;
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 1000;
            border-bottom: var(--border-glow);
        }
        .header .container { display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 18px; }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-icon {
            width: 44px; height: 44px; border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: var(--white);
            box-shadow: 0 0 30px var(--primary-glow);
            animation: iconPulse 3s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 30px var(--primary-glow); }
            50% { box-shadow: 0 0 60px var(--secondary-glow); }
        }
        .brand h1 {
            font-size: 22px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header-actions { display: flex; align-items: center; gap: 14px; }
        .btn-icon {
            width: 44px; height: 44px; border-radius: 50%;
            border: var(--border-glow); background: rgba(255,255,255,0.05);
            color: var(--gray); cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .btn-icon:hover { background: var(--primary); color: var(--white); transform: translateY(-2px); box-shadow: 0 0 30px var(--primary-glow); }
        .avatar {
            width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--primary); cursor: pointer; transition: var(--transition);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .avatar:hover { transform: scale(1.08) rotate(-5deg); border-color: var(--secondary); }
        .sidebar-toggle {
            display: none; width: 44px; height: 44px; border-radius: var(--radius-sm);
            border: var(--border-glow); background: rgba(255,255,255,0.05);
            color: var(--white); cursor: pointer; transition: var(--transition);
            align-items: center; justify-content: center; font-size: 20px;
        }
        .sidebar-toggle:hover { background: var(--primary); box-shadow: 0 0 30px var(--primary-glow); }

        /* SIDEBAR */
        .sidebar {
            position: fixed; top: 72px; left: 0; bottom: 0; width: 270px;
            background: rgba(22, 33, 62, 0.92); backdrop-filter: blur(20px);
            border-right: var(--border-glow); padding: 20px 0;
            transition: var(--transition); z-index: 900; overflow-y: auto;
        }
        .sidebar-menu { list-style: none; padding: 0 14px; }
        .menu-label {
            font-size: 11px; font-weight: 700; color: var(--gray);
            text-transform: uppercase; letter-spacing: 1.5px;
            padding: 16px 14px 8px; opacity: 0.5;
        }
        .sidebar-item { margin-bottom: 2px; }
        .sidebar-link {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 16px; border-radius: var(--radius-sm);
            color: var(--gray); text-decoration: none;
            font-weight: 500; font-size: 14px;
            transition: var(--transition);
            position: relative;
        }
        .sidebar-link i { width: 22px; font-size: 18px; text-align: center; }
        .sidebar-link:hover { background: rgba(108, 92, 231, 0.15); color: var(--white); transform: translateX(4px); }
        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(0, 210, 211, 0.1));
            color: var(--white); font-weight: 600;
        }
        .sidebar-link.active::before {
            content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
            width: 4px; background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 0 4px 4px 0; box-shadow: 0 0 20px var(--primary-glow);
        }
        .sidebar-link .link-icon {
            width: 36px; height: 36px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            background: rgba(108, 92, 231, 0.1); transition: var(--transition);
        }
        .sidebar-link:hover .link-icon { background: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
        .sidebar-link .link-text { flex: 1; }

        /* MAIN */
        .main-content {
            margin-top: 72px; margin-left: 270px;
            padding: 30px 20px 60px;
            transition: var(--transition); min-height: 100vh;
        }

        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 32px; flex-wrap: wrap; gap: 16px;
        }
        .page-header h1 {
            font-size: 30px; font-weight: 800;
            display: flex; align-items: center; gap: 14px;
        }
        .page-header h1 i {
            color: var(--primary); background: rgba(108, 92, 231, 0.15);
            padding: 12px; border-radius: var(--radius-sm); font-size: 24px;
            box-shadow: 0 0 30px var(--primary-glow);
        }
        .page-header p { color: var(--gray); font-size: 15px; margin-left: 54px; }

        .page-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .search-wrapper {
            position: relative; display: flex; align-items: center;
        }
        .search-wrapper i {
            position: absolute; left: 14px; color: var(--gray);
        }
        .search-wrapper input {
            padding: 10px 16px 10px 42px;
            border: 2px solid rgba(255,255,255,0.08); border-radius: var(--radius-sm);
            font-size: 14px; font-family: 'Inter', sans-serif;
            background: rgba(255,255,255,0.05); color: var(--white);
            transition: var(--transition); width: 220px;
        }
        .search-wrapper input:focus {
            border-color: var(--primary); outline: none;
            box-shadow: 0 0 30px var(--primary-glow);
        }
        .search-wrapper input::placeholder { color: var(--gray); }

        .btn {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 10px 20px; border-radius: var(--radius-sm);
            font-weight: 600; font-size: 14px; border: none;
            cursor: pointer; transition: var(--transition);
            font-family: 'Inter', sans-serif; text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white); box-shadow: 0 0 30px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 50px var(--primary-glow); }
        .btn-success {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-light));
            color: var(--dark);
        }
        .btn-success:hover { transform: translateY(-2px); box-shadow: 0 0 30px var(--secondary-glow); }
        .btn-danger {
            background: var(--danger); color: var(--white);
        }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(255, 107, 107, 0.3); }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* STATS */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px; margin-bottom: 28px;
        }
        .stat-card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border-radius: var(--radius); padding: 18px 22px;
            border: var(--border-glow); text-align: center;
            transition: var(--transition);
        }
        .stat-card:hover { border-color: var(--primary); transform: translateY(-4px); }
        .stat-card .stat-value {
            font-size: 30px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .stat-card .stat-label {
            font-size: 12px; font-weight: 500; color: var(--gray);
            text-transform: uppercase; letter-spacing: 0.3px;
        }

        /* CARD */
        .card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border-radius: var(--radius); padding: 26px 30px;
            border: var(--border-glow); transition: var(--transition);
        }
        .card:hover { border-color: var(--primary); box-shadow: var(--shadow-hover); }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 16px;
            border-bottom: var(--border-glow); flex-wrap: wrap; gap: 12px;
        }
        .card-header h2 {
            font-size: 18px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }
        .card-header h2 i { color: var(--primary); }

        /* USER LIST */
        .user-list { display: flex; flex-direction: column; gap: 12px; }
        .user-row {
            background: rgba(255,255,255,0.03); border-radius: var(--radius-sm);
            padding: 14px 20px; transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.05);
            display: grid; grid-template-columns: 1.2fr 0.8fr 1.2fr 0.8fr 1fr 1.2fr;
            gap: 12px; align-items: center;
        }
        .user-row:hover { border-color: var(--primary); background: rgba(108, 92, 231, 0.05); }
        .user-row .user-name { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .user-row .user-name i { color: var(--primary); }
        .user-status {
            font-size: 11px; font-weight: 600; padding: 3px 14px;
            border-radius: 20px; text-transform: uppercase; letter-spacing: 0.3px;
            display: inline-block; width: fit-content;
        }
        .user-status.active { background: rgba(0, 210, 211, 0.15); color: var(--secondary-light); }
        .user-status.inactive { background: rgba(255, 107, 107, 0.15); color: var(--danger); }
        .user-row .user-field { font-size: 13px; color: var(--gray); }
        .user-row .user-actions { display: flex; gap: 6px; flex-wrap: wrap; }

        .loading-text { text-align: center; padding: 40px 20px; color: var(--gray); }
        .loading-text i { font-size: 36px; color: var(--primary); margin-bottom: 12px; display: block; animation: spin 1.5s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .no-users { text-align: center; padding: 40px 20px; color: var(--gray); }
        .no-users i { font-size: 40px; color: var(--gray); margin-bottom: 12px; display: block; }

        .maintenance-warning {
            background: rgba(253, 203, 110, 0.12); border: 1px solid rgba(253, 203, 110, 0.2);
            border-radius: var(--radius-sm); padding: 14px 20px; margin-bottom: 24px;
            display: none; align-items: center; gap: 12px;
            color: var(--white); font-weight: 500;
        }
        .maintenance-warning i { color: var(--warning); font-size: 20px; }

        /* TOAST */
        #toastContainer {
            position: fixed; bottom: 30px; right: 30px;
            z-index: 9999; display: flex; flex-direction: column; gap: 12px;
        }
        .toast {
            padding: 14px 22px; border-radius: var(--radius-sm);
            color: var(--white); font-weight: 500; font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.4s ease forwards;
            display: flex; align-items: center; gap: 12px;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* RESPONSIVE */
        @media (max-width: 992px) {
            .sidebar-toggle { display: flex; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .user-row { grid-template-columns: 1fr; gap: 8px; padding: 14px 16px; }
            .user-row .user-actions { justify-content: flex-start; margin-top: 4px; }
        }
        @media (max-width: 768px) {
            .page-header { flex-direction: column; align-items: flex-start; }
            .page-actions { width: 100%; flex-direction: column; }
            .search-wrapper input { width: 100%; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .brand h1 { font-size: 17px; }
            .card { padding: 16px; }
            .page-header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="index.html" class="brand">
                    <div class="brand-icon"><i class="fas fa-crown"></i></div>
                    <h1>AdminHub</h1>
                </a>
            </div>
            <div class="header-actions">
                <button class="btn-icon" title="Notifications">
                    <i class="fas fa-bell"></i>
                </button>
                <img src="logo.png" alt="Admin" class="avatar" />
            </div>
        </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <ul class="sidebar-menu">
            <li class="menu-label">Main Navigation</li>
            <li class="sidebar-item">
                <a href="index.html" class="sidebar-link">
                    <span class="link-icon"><i class="fas fa-chart-pie"></i></span>
                    <span class="link-text">Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="admin.html" class="sidebar-link">
                    <span class="link-icon"><i class="fas fa-user-plus"></i></span>
                    <span class="link-text">Add User</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="dashboard.html" class="sidebar-link active">
                    <span class="link-icon"><i class="fas fa-users-cog"></i></span>
                    <span class="link-text">Manage Users</span>
                </a>
            </li>
            <li class="menu-label">System</li>
            <li class="sidebar-item">
                <a href="settings.html" class="sidebar-link">
                    <span class="link-icon"><i class="fas fa-sliders-h"></i></span>
                    <span class="link-text">Settings</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main-content" id="mainContent">
        <div class="container">

            <div class="page-header">
                <div>
                    <h1><i class="fas fa-users-cog"></i> Manage Users</h1>
                    <p>View, update, and manage all user accounts.</p>
                </div>
                <div class="page-actions">
                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search users..." oninput="filterUsers()" />
                    </div>
                    <a href="admin.html" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Add User
                    </a>
                    <button class="btn btn-success btn-sm" onclick="refreshData()">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <div id="maintenanceWarning" class="maintenance-warning">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Site is in <strong>Maintenance Mode</strong>. User management is restricted.</span>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalUsers">0</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="activeUsers">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="inactiveUsers">0</div>
                    <div class="stat-label">Inactive</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-list"></i> All Users</h2>
                    <span style="font-size:13px;color:var(--gray);" id="userCount">0 users</span>
                </div>
                <div id="userList" class="user-list">
                    <div class="loading-text">
                        <i class="fas fa-spinner"></i>
                        Loading users...
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div id="toastContainer"></div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

        // ---- Sidebar ----
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            mainContent.classList.toggle('shifted');
        });
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 992) {
                const isSidebar = sidebar.contains(e.target);
                const isToggle = sidebarToggle.contains(e.target);
                if (!isSidebar && !isToggle && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    mainContent.classList.remove('shifted');
                }
            }
        });

        let allUsers = {};
        let isMaintenance = false;

        const userListEl = document.getElementById('userList');
        const totalUsersEl = document.getElementById('totalUsers');
        const activeUsersEl = document.getElementById('activeUsers');
        const inactiveUsersEl = document.getElementById('inactiveUsers');
        const userCountEl = document.getElementById('userCount');
        const maintenanceWarning = document.getElementById('maintenanceWarning');
        const toastContainer = document.getElementById('toastContainer');

        // ---- Maintenance ----
        const settingsRef = ref(db, 'settings/appupdate');
        onValue(settingsRef, (snapshot) => {
            const settings = snapshot.val();
            isMaintenance = settings?.maintenanceMode === 'true';
            maintenanceWarning.style.display = isMaintenance ? 'flex' : 'none';
            loadUsers();
        });

        // ---- Load Users ----
        function loadUsers() {
            const usersRef = ref(db, "userinfo");
            onValue(usersRef, (snapshot) => {
                if (snapshot.exists()) {
                    allUsers = snapshot.val();
                    renderUsers(allUsers);
                    updateStats(allUsers);
                } else {
                    allUsers = {};
                    userListEl.innerHTML = `<div class="no-users"><i class="fas fa-user-slash"></i>No users found</div>`;
                    updateStats({});
                }
            }, (error) => {
                userListEl.innerHTML = `<div class="no-users"><i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>Error: ${error.message}</div>`;
            });
        }

        // ---- Render ----
        function renderUsers(users) {
            const entries = Object.entries(users);
            if (entries.length === 0) {
                userListEl.innerHTML = `<div class="no-users"><i class="fas fa-user-slash"></i>No users found</div>`;
                userCountEl.textContent = '0 users';
                return;
            }

            userListEl.innerHTML = '';
            userCountEl.textContent = `${entries.length} users`;

            entries.forEach(([username, user]) => {
                const row = document.createElement('div');
                row.className = 'user-row';
                row.dataset.username = username;
                row.innerHTML = `
                    <div class="user-name"><i class="fas fa-user-circle"></i>${username}</div>
                    <div class="user-field"><span class="user-status ${user.status}">${user.status}</span></div>
                    <div class="user-field">${user.validity || 'N/A'}</div>
                    <div class="user-field">${user.access === '∞' ? 'Unlimited' : '1 Device'}</div>
                    <div class="user-field">${user.rgtime || 'N/A'}</div>
                    <div class="user-actions">
                        <button class="btn btn-success btn-sm" onclick="window.updateUser('${username}')" ${isMaintenance ? 'disabled' : ''}>
                            <i class="fas fa-save"></i> Update
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="window.deleteUser('${username}')" ${isMaintenance ? 'disabled' : ''}>
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                `;
                userListEl.appendChild(row);
            });
        }

        // ---- Stats ----
        function updateStats(users) {
            let total = 0, active = 0, inactive = 0;
            Object.values(users).forEach(user => {
                total++;
                user.status === 'active' ? active++ : inactive++;
            });
            totalUsersEl.textContent = total;
            activeUsersEl.textContent = active;
            inactiveUsersEl.textContent = inactive;
        }

        // ---- Filter ----
        window.filterUsers = function() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = {};
            for (let key in allUsers) {
                if (key.toLowerCase().includes(search)) filtered[key] = allUsers[key];
            }
            renderUsers(filtered);
            updateStats(filtered);
        };

        // ---- Update User ----
        window.updateUser = function(username) {
            if (isMaintenance) {
                showToast('Cannot update in Maintenance Mode.', 'error');
                return;
            }

            const user = allUsers[username];
            if (!user) { showToast('User not found.', 'error'); return; }

            const newPassword = prompt(`Enter new password for "${username}" (leave empty to keep current):`);
            if (newPassword === null) return;

            const newStatus = confirm(`Set "${username}" as active? Click OK for Active, Cancel for Inactive.`);
            const statusValue = newStatus ? 'active' : 'inactive';

            const newValidity = prompt(`Enter new validity (DD-MM-YYYY HH:MM) or leave empty:`, user.validity || '');
            if (newValidity === null) return;

            const accessChoice = confirm(`Set "${username}" to Unlimited Devices? OK = Unlimited, Cancel = 1 Device.`);
            const accessValue = accessChoice ? '∞' : '1';

            const updates = { status: statusValue, access: accessValue };
            if (newPassword.trim() !== '') updates.password = newPassword.trim();
            if (newValidity.trim() !== '') updates.validity = newValidity.trim();

            update(ref(db, `userinfo/${username}`), updates)
                .then(() => {
                    showToast(`✅ User "${username}" updated!`, 'success');
                    allUsers[username] = { ...allUsers[username], ...updates };
                    renderUsers(allUsers);
                    updateStats(allUsers);
                })
                .catch((error) => showToast('❌ Error: ' + error.message, 'error'));
        };

        // ---- Delete User ----
        window.deleteUser = function(username) {
            if (isMaintenance) {
                showToast('Cannot delete in Maintenance Mode.', 'error');
                return;
            }
            if (!confirm(`⚠️ Delete "${username}"? This cannot be undone.`)) return;

            remove(ref(db, `userinfo/${username}`))
                .then(() => {
                    showToast(`🗑️ User "${username}" deleted!`, 'success');
                    delete allUsers[username];
                    renderUsers(allUsers);
                    updateStats(allUsers);
                })
                .catch((error) => showToast('❌ Error: ' + error.message, 'error'));
        };

        // ---- Toast ----
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'var(--success)' : type === 'error' ? 'var(--danger)' : 'var(--primary)';
            toast.style.cssText = `background:${bgColor};color:var(--white);padding:14px 22px;border-radius:var(--radius-sm);font-weight:500;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,0.3);animation:slideIn 0.4s ease forwards;display:flex;align-items:center;gap:12px;`;
            toast.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--white);cursor:pointer;font-size:16px;opacity:0.7;">✕</button>`;
            toastContainer.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        window.showToast = showToast;
        window.refreshData = function() {
            showToast('🔄 Refreshing data...', 'success');
            loadUsers();
        };

        const style = document.createElement('style');
        style.textContent = `@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }`;
        document.head.appendChild(style);
    </script>

</body>
</html>
