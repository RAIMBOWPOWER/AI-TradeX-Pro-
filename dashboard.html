<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users | AdminPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== SAME CLEAN STYLES AS INDEX ===== */
        :root {
            --primary: #6C5CE7; --primary-dark: #5A3FD9; --primary-light: #A29BFE;
            --secondary: #00D2D3; --secondary-light: #55EFC4;
            --success: #00B894; --danger: #FF6B6B; --warning: #FDCB6E;
            --dark: #0a0a1a; --dark-card: #12122a; --bg: #080816;
            --gray: #6c7a89; --gray-light: #a0aec0; --white: #ffffff;
            --radius: 12px; --radius-sm: 8px;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
            --transition: all 0.3s ease;
            --border: 1px solid rgba(108,92,231,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--white);
            line-height: 1.5;
            min-height: 100vh;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(ellipse at 20% 30%, rgba(108,92,231,0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 70%, rgba(0,210,211,0.04) 0%, transparent 50%);
            z-index: -1;
        }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .container { max-width: 1280px; margin: 0 auto; padding: 0 16px; }

        /* HEADER */
        .header {
            background: var(--dark-card);
            padding: 10px 0;
            position: fixed; top: 0; left: 0; right: 0;
            z-index: 1000;
            border-bottom: var(--border);
        }
        .header .container { display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .sidebar-toggle {
            width: 38px; height: 38px; border-radius: var(--radius-sm);
            border: none; background: rgba(255,255,255,0.04);
            color: var(--white); cursor: pointer; transition: var(--transition);
            font-size: 18px; display: flex; align-items: center; justify-content: center;
        }
        .sidebar-toggle:hover { background: var(--primary); }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand-icon {
            width: 36px; height: 36px; border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; color: var(--white);
        }
        .brand h1 { font-size: 17px; font-weight: 800; color: var(--white); }
        .brand h1 span { color: var(--primary-light); }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .btn-icon {
            width: 38px; height: 38px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.04); color: var(--gray-light);
            cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }
        .btn-icon:hover { background: var(--primary); color: var(--white); }
        .avatar {
            width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--primary); cursor: pointer;
        }
        .avatar:hover { border-color: var(--secondary); }

        /* SIDEBAR */
        .sidebar {
            position: fixed; top: 58px; left: 0; bottom: 0; width: 220px;
            background: var(--dark-card); border-right: var(--border);
            padding: 12px 0; transition: var(--transition); z-index: 900;
            overflow-y: auto; transform: translateX(-100%);
        }
        .sidebar.open { transform: translateX(0); }
        .sidebar-menu { list-style: none; padding: 0 10px; }
        .menu-label {
            font-size: 9px; font-weight: 700; color: var(--gray);
            text-transform: uppercase; letter-spacing: 1px;
            padding: 10px 12px 4px; opacity: 0.5;
        }
        .sidebar-item { margin-bottom: 2px; }
        .sidebar-link {
            display: flex; align-items: center; gap: 12px;
            padding: 9px 12px; border-radius: var(--radius-sm);
            color: var(--gray-light); text-decoration: none;
            font-weight: 500; font-size: 13px;
            transition: var(--transition); position: relative;
        }
        .sidebar-link i { width: 18px; font-size: 15px; text-align: center; }
        .sidebar-link:hover { background: rgba(108,92,231,0.08); color: var(--white); }
        .sidebar-link.active {
            background: rgba(108,92,231,0.12); color: var(--white); font-weight: 600;
        }
        .sidebar-link.active::before {
            content: ''; position: absolute; left: 0; top: 4px; bottom: 4px;
            width: 3px; background: var(--primary); border-radius: 0 3px 3px 0;
        }

        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 899; display: none;
        }
        .overlay.open { display: block; }

        .main-content {
            margin-top: 58px; margin-left: 0;
            padding: 20px 16px 40px;
            transition: var(--transition);
            min-height: 100vh;
        }

        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .page-header h1 {
            font-size: 22px; font-weight: 800;
            display: flex; align-items: center; gap: 10px;
        }
        .page-header h1 i { color: var(--primary); }
        .page-header p { color: var(--gray); font-size: 13px; margin-top: 2px; }

        .page-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .search-wrapper { position: relative; display: flex; align-items: center; }
        .search-wrapper i {
            position: absolute; left: 10px; color: var(--gray); font-size: 12px;
        }
        .search-wrapper input {
            padding: 7px 10px 7px 32px;
            border: 1px solid rgba(255,255,255,0.06); border-radius: var(--radius-sm);
            font-size: 12px; font-family: 'Inter', sans-serif;
            background: rgba(255,255,255,0.03); color: var(--white);
            transition: var(--transition); width: 160px;
        }
        .search-wrapper input:focus {
            border-color: var(--primary); outline: none;
        }
        .search-wrapper input::placeholder { color: var(--gray); }

        .btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 14px; border-radius: var(--radius-sm);
            font-weight: 600; font-size: 12px; border: none;
            cursor: pointer; transition: var(--transition);
            font-family: 'Inter', sans-serif; text-decoration: none;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(108,92,231,0.3); }
        .btn-success { background: var(--success); color: var(--white); }
        .btn-success:hover { transform: translateY(-2px); }
        .btn-danger { background: var(--danger); color: var(--white); }
        .btn-danger:hover { transform: translateY(-2px); }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .btn-xs { padding: 2px 8px; font-size: 10px; border-radius: 4px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* STATS */
        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px; margin-bottom: 16px;
        }
        .stat-card {
            background: var(--dark-card); border-radius: var(--radius-sm);
            padding: 12px 14px; border: var(--border);
            text-align: center; transition: var(--transition);
        }
        .stat-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .stat-card .stat-value {
            font-size: 22px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-card .stat-label {
            font-size: 9px; font-weight: 600; color: var(--gray);
            text-transform: uppercase; letter-spacing: 0.3px;
        }

        /* CARD */
        .card {
            background: var(--dark-card); border-radius: var(--radius-sm);
            padding: 16px 18px; border: var(--border);
            transition: var(--transition);
        }
        .card:hover { border-color: rgba(108,92,231,0.2); }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 10px;
            border-bottom: var(--border); flex-wrap: wrap; gap: 8px;
        }
        .card-header h2 {
            font-size: 15px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
        }
        .card-header h2 i { color: var(--primary); }

        /* USER LIST */
        .user-list { display: flex; flex-direction: column; gap: 6px; }
        .user-row {
            background: rgba(255,255,255,0.02); border-radius: var(--radius-sm);
            padding: 8px 12px; transition: var(--transition);
            border: 1px solid rgba(255,255,255,0.03);
            display: grid; grid-template-columns: 1.2fr 0.8fr 1.2fr 0.8fr 1fr 1fr;
            gap: 8px; align-items: center; font-size: 12px;
        }
        .user-row:hover { border-color: var(--primary); background: rgba(108,92,231,0.04); }
        .user-row .user-name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .user-row .user-name i { color: var(--primary); }
        .user-status {
            font-size: 9px; font-weight: 700; padding: 2px 10px;
            border-radius: 20px; text-transform: uppercase;
            display: inline-block; width: fit-content;
        }
        .user-status.active { background: rgba(0,210,211,0.12); color: var(--secondary-light); }
        .user-status.inactive { background: rgba(255,107,107,0.12); color: var(--danger); }
        .user-status.expired { background: rgba(253,203,110,0.12); color: var(--warning); }
        .user-row .user-field { color: var(--gray); font-size: 11px; }
        .user-row .user-actions { display: flex; gap: 4px; flex-wrap: wrap; }

        .loading-text { text-align: center; padding: 30px 20px; color: var(--gray); }
        .loading-text i { font-size: 28px; color: var(--primary); margin-bottom: 8px; display: block; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .no-users { text-align: center; padding: 30px 20px; color: var(--gray); }
        .no-users i { font-size: 28px; color: var(--gray); margin-bottom: 8px; display: block; }

        .maintenance-warning {
            background: rgba(253,203,110,0.08); border: 1px solid rgba(253,203,110,0.1);
            border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 16px;
            display: none; align-items: center; gap: 10px;
            color: var(--white); font-weight: 500; font-size: 13px;
        }
        .maintenance-warning i { color: var(--warning); font-size: 16px; }

        #toastContainer {
            position: fixed; bottom: 16px; right: 16px;
            z-index: 9999; display: flex; flex-direction: column; gap: 8px;
            max-width: 340px; width: 100%;
        }
        .toast {
            padding: 10px 16px; border-radius: var(--radius-sm);
            color: var(--white); font-weight: 500; font-size: 13px;
            box-shadow: var(--shadow); animation: slideUp 0.3s ease forwards;
            display: flex; align-items: center; gap: 10px;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .page-header { flex-direction: column; align-items: flex-start; }
            .page-actions { width: 100%; flex-direction: column; }
            .search-wrapper input { width: 100%; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .user-row { grid-template-columns: 1fr; gap: 4px; padding: 10px 12px; }
            .user-row .user-actions { justify-content: flex-start; margin-top: 4px; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .brand h1 { font-size: 15px; }
            .brand-icon { width: 32px; height: 32px; font-size: 14px; }
            .page-header h1 { font-size: 18px; }
            .card { padding: 12px 14px; }
            .header-actions .btn-icon:not(.avatar):not(.sidebar-toggle) { display: none; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="index.html" class="brand">
                    <div class="brand-icon"><i class="fas fa-crown"></i></div>
                    <h1>Admin<span>Pro</span></h1>
                </a>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i>
                </button>
                <img src="logo.png" alt="Admin" class="avatar" />
            </div>
        </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <ul class="sidebar-menu">
            <li class="menu-label">Main Menu</li>
            <li class="sidebar-item">
                <a href="index.html" class="sidebar-link">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="admin.html" class="sidebar-link">
                    <i class="fas fa-user-plus"></i>
                    <span>Add User</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="dashboard.html" class="sidebar-link active">
                    <i class="fas fa-users-cog"></i>
                    <span>Manage Users</span>
                </a>
            </li>
            <li class="menu-label">System</li>
            <li class="sidebar-item">
                <a href="settings.html" class="sidebar-link">
                    <i class="fas fa-sliders-h"></i>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- ===== OVERLAY ===== -->
    <div class="overlay" id="overlay"></div>

    <!-- ===== MAIN ===== -->
    <main class="main-content" id="mainContent">
        <div class="container">

            <div class="page-header">
                <div>
                    <h1><i class="fas fa-users-cog"></i> Manage Users</h1>
                    <p>View and manage all user accounts</p>
                </div>
                <div class="page-actions">
                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search..." oninput="filterUsers()" />
                    </div>
                    <a href="admin.html" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Add
                    </a>
                    <button class="btn btn-sm" onclick="refreshData()" style="background:rgba(255,255,255,0.04);color:var(--white);">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>
            </div>

            <div id="maintenanceWarning" class="maintenance-warning">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Maintenance mode active. Management restricted.</span>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalUsers">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="activeUsers">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="inactiveUsers">0</div>
                    <div class="stat-label">Inactive</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="expiredUsers">0</div>
                    <div class="stat-label">Expired</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-list"></i> All Users</h2>
                    <span style="font-size:11px;color:var(--gray);" id="userCount">0 users</span>
                </div>
                <div id="userList" class="user-list">
                    <div class="loading-text">
                        <i class="fas fa-spinner"></i>
                        Loading...
                    </div>
                </div>
            </div>

        </div>
    </main>

    <div id="toastContainer"></div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

        // ---- Sidebar ----
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        });

        let allUsers = {};
        let isMaintenance = false;

        const userListEl = document.getElementById('userList');
        const totalUsersEl = document.getElementById('totalUsers');
        const activeUsersEl = document.getElementById('activeUsers');
        const inactiveUsersEl = document.getElementById('inactiveUsers');
        const expiredUsersEl = document.getElementById('expiredUsers');
        const userCountEl = document.getElementById('userCount');
        const maintenanceWarning = document.getElementById('maintenanceWarning');

        // ---- Toast ----
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${message}</span>
                <button onclick="this.parentElement.remove()" style="background:none;border:none;color:inherit;cursor:pointer;font-size:16px;opacity:0.7;margin-left:auto;">✕</button>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }
        window.showToast = showToast;

        // ---- Check Expiry ----
        function checkExpiry(validity) {
            if (!validity) return 'active';
            try {
                const parts = validity.split(' ');
                const dateParts = parts[0].split('-');
                const timeParts = parts[1] ? parts[1].split(':') : ['00', '00'];
                const date = new Date(
                    parseInt(dateParts[2]), parseInt(dateParts[1]) - 1,
                    parseInt(dateParts[0]), parseInt(timeParts[0]) || 0,
                    parseInt(timeParts[1]) || 0
                );
                return date < new Date() ? 'expired' : 'active';
            } catch { return 'active'; }
        }

        // ---- Maintenance ----
        const settingsRef = ref(db, 'settings/appupdate');
        onValue(settingsRef, (snapshot) => {
            const settings = snapshot.val();
            isMaintenance = settings?.maintenanceMode === 'true';
            maintenanceWarning.style.display = isMaintenance ? 'flex' : 'none';
            loadUsers();
        });

        // ---- Load Users ----
        function loadUsers() {
            const usersRef = ref(db, "userinfo");
            onValue(usersRef, (snapshot) => {
                if (snapshot.exists()) {
                    allUsers = snapshot.val();
                    renderUsers(allUsers);
                    updateStats(allUsers);
                } else {
                    allUsers = {};
                    userListEl.innerHTML = `<div class="no-users"><i class="fas fa-user-slash"></i>No users found</div>`;
                    updateStats({});
                }
            }, (error) => {
                userListEl.innerHTML = `<div class="no-users"><i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>${error.message}</div>`;
            });
        }

        // ---- Render ----
        function renderUsers(users) {
            const entries = Object.entries(users);
            if (entries.length === 0) {
                userListEl.innerHTML = `<div class="no-users"><i class="fas fa-user-slash"></i>No users found</div>`;
                userCountEl.textContent = '0 users';
                return;
            }

            userListEl.innerHTML = '';
            userCountEl.textContent = `${entries.length} users`;

            entries.forEach(([username, user]) => {
                const status = checkExpiry(user.validity);
                const row = document.createElement('div');
                row.className = 'user-row';
                row.dataset.username = username;
                row.innerHTML = `
                    <div class="user-name"><i class="fas fa-user-circle"></i>${username}</div>
                    <div class="user-field"><span class="user-status ${status}">${status}</span></div>
                    <div class="user-field">${user.validity || 'N/A'}</div>
                    <div class="user-field">${user.access === '∞' ? 'Unlimited' : '1 Device'}</div>
                    <div class="user-field">${user.rgtime || 'N/A'}</div>
                    <div class="user-actions">
                        <button class="btn btn-success btn-xs" onclick="window.updateUser('${username}')" ${isMaintenance ? 'disabled' : ''}>
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-danger btn-xs" onclick="window.deleteUser('${username}')" ${isMaintenance ? 'disabled' : ''}>
                            <i class="fas fa-trash"></i>
                        </button>
                        <button class="btn btn-xs" style="background:rgba(255,255,255,0.04);color:var(--gray-light);" onclick="window.copyUsername('${username}')">
                            <i class="fas fa-copy"></i>
                        </button>
                    </div>
                `;
                userListEl.appendChild(row);
            });
        }

        // ---- Stats ----
        function updateStats(users) {
            let total = 0, active = 0, inactive = 0, expired = 0;
            Object.values(users).forEach(user => {
                total++;
                const status = checkExpiry(user.validity);
                if (status === 'expired') expired++;
                else if (user.status === 'active') active++;
                else inactive++;
            });
            totalUsersEl.textContent = total;
            activeUsersEl.textContent = active;
            inactiveUsersEl.textContent = inactive;
            expiredUsersEl.textContent = expired;
        }

        // ---- Filter ----
        window.filterUsers = function() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = {};
            for (let key in allUsers) {
                if (key.toLowerCase().includes(search)) filtered[key] = allUsers[key];
            }
            renderUsers(filtered);
            updateStats(filtered);
        };

        // ---- Copy ----
        window.copyUsername = function(username) {
            navigator.clipboard.writeText(username);
            showToast(`📋 Copied "${username}"`, 'success');
        };

        // ---- Update ----
        window.updateUser = function(username) {
            if (isMaintenance) {
                showToast('Cannot update in Maintenance Mode.', 'error');
                return;
            }
            const user = allUsers[username];
            if (!user) { showToast('User not found.', 'error'); return; }

            const newPassword = prompt(`New password for "${username}" (leave empty to keep):`);
            if (newPassword === null) return;

            const newStatus = confirm(`Set "${username}" as active? OK=Active, Cancel=Inactive.`);
            const statusValue = newStatus ? 'active' : 'inactive';

            const newValidity = prompt(`New validity (DD-MM-YYYY HH:MM):`, user.validity || '');
            if (newValidity === null) return;

            const accessChoice = confirm(`Unlimited devices? OK=Yes, Cancel=No.`);
            const accessValue = accessChoice ? '∞' : '1';

            const updates = { status: statusValue, access: accessValue };
            if (newPassword.trim() !== '') updates.password = newPassword.trim();
            if (newValidity.trim() !== '') updates.validity = newValidity.trim();

            update(ref(db, `userinfo/${username}`), updates)
                .then(() => {
                    showToast(`✅ "${username}" updated!`, 'success');
                    allUsers[username] = { ...allUsers[username], ...updates };
                    renderUsers(allUsers);
                    updateStats(allUsers);
                })
                .catch((error) => showToast('❌ Error: ' + error.message, 'error'));
        };

        // ---- Delete ----
        window.deleteUser = function(username) {
            if (isMaintenance) {
                showToast('Cannot delete in Maintenance Mode.', 'error');
                return;
            }
            if (!confirm(`⚠️ Delete "${username}"? This cannot be undone.`)) return;

            remove(ref(db, `userinfo/${username}`))
                .then(() => {
                    showToast(`🗑️ "${username}" deleted!`, 'success');
                    delete allUsers[username];
                    renderUsers(allUsers);
                    updateStats(allUsers);
                })
                .catch((error) => showToast('❌ Error: ' + error.message, 'error'));
        };

        // ---- Refresh - MANUAL ONLY ----
        window.refreshData = function() {
            showToast('🔄 Refreshing...', 'info');
            loadUsers();
        };

        console.log('✅ Manage Users Loaded! (No Auto-Refresh)');
    </script>

</body>
</html>
