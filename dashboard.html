<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Manage Users | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        :root {
            --primary: #6C5CE7;
            --primary-dark: #5A4BD1;
            --primary-light: #A29BFE;
            --secondary: #00CEC9;
            --success: #00B894;
            --danger: #FF6B6B;
            --warning: #FDCB6E;
            --info: #74B9FF;
            --dark: #2D3436;
            --dark-light: #636E72;
            --gray: #B2BEC3;
            --light: #DFE6E9;
            --white: #FFFFFF;
            --bg: #F0F2F5;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 15px 40px rgba(108, 92, 231, 0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--dark);
            line-height: 1.6;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 10px; }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== Header ===== */
        .header {
            background: var(--white);
            padding: 14px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .header-left .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left .brand i {
            font-size: 28px;
            color: var(--primary);
            background: rgba(108, 92, 231, 0.12);
            padding: 8px;
            border-radius: var(--radius-sm);
        }

        .header-left .brand h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-actions .btn-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            color: var(--dark-light);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            position: relative;
        }

        .header-actions .btn-icon:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-2px);
        }

        .header-actions .btn-icon .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: var(--danger);
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-light);
            cursor: pointer;
            transition: var(--transition);
        }

        .avatar:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .sidebar-toggle {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--bg);
            color: var(--dark);
            cursor: pointer;
            transition: var(--transition);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .sidebar-toggle:hover {
            background: var(--primary);
            color: var(--white);
        }

        /* ===== Sidebar ===== */
        .sidebar {
            position: fixed;
            top: 74px;
            left: 0;
            bottom: 0;
            width: 260px;
            background: var(--white);
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.05);
            padding: 20px 0;
            transition: var(--transition);
            z-index: 900;
            overflow-y: auto;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 12px;
        }

        .sidebar-menu .menu-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 12px 14px 8px;
        }

        .sidebar-menu .sidebar-item {
            margin-bottom: 2px;
        }

        .sidebar-menu .sidebar-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: var(--dark-light);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: var(--transition);
            position: relative;
        }

        .sidebar-menu .sidebar-link i {
            width: 20px;
            font-size: 18px;
            text-align: center;
        }

        .sidebar-menu .sidebar-link:hover {
            background: rgba(108, 92, 231, 0.08);
            color: var(--primary);
        }

        .sidebar-menu .sidebar-link.active {
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.12), rgba(0, 206, 201, 0.08));
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-menu .sidebar-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 4px;
            background: var(--primary);
            border-radius: 0 4px 4px 0;
        }

        /* ===== Main Content ===== */
        .main-content {
            margin-top: 74px;
            margin-left: 260px;
            padding: 30px 20px 60px;
            transition: var(--transition);
            min-height: 100vh;
        }

        /* ===== Page Header ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-header .page-title {
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header .page-title i {
            color: var(--primary);
            background: rgba(108, 92, 231, 0.12);
            padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 22px;
        }

        .page-header .page-subtitle {
            color: var(--dark-light);
            font-size: 14px;
            font-weight: 400;
        }

        .page-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .search-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-wrapper i {
            position: absolute;
            left: 14px;
            color: var(--gray);
        }

        .search-wrapper input {
            padding: 10px 16px 10px 42px;
            border: 2px solid var(--light);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            background: var(--white);
            transition: var(--transition);
            width: 220px;
        }

        .search-wrapper input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.10);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 14px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.30);
        }

        .btn-success {
            background: var(--success);
            color: var(--white);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.30);
        }

        .btn-danger {
            background: var(--danger);
            color: var(--white);
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.30);
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===== Stats ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 18px 22px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--dark);
        }

        .stat-card .stat-label {
            font-size: 12px;
            font-weight: 500;
            color: var(--dark-light);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        /* ===== Card ===== */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 24px 28px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--light);
            flex-wrap: wrap;
            gap: 12px;
        }

        .card .card-header h2 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card .card-header h2 i {
            color: var(--primary);
        }

        /* ===== User List ===== */
        .user-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .user-row {
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            transition: var(--transition);
            border: 1px solid transparent;
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr 0.8fr 1fr 1fr;
            gap: 12px;
            align-items: center;
        }

        .user-row:hover {
            border-color: var(--primary-light);
            background: var(--white);
        }

        .user-row .user-name {
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-row .user-name i {
            color: var(--primary-light);
        }

        .user-row .user-status {
            font-size: 11px;
            font-weight: 600;
            padding: 3px 12px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: inline-block;
            width: fit-content;
        }

        .user-row .user-status.active {
            background: rgba(0, 184, 148, 0.12);
            color: var(--success);
        }

        .user-row .user-status.inactive {
            background: rgba(255, 107, 107, 0.12);
            color: var(--danger);
        }

        .user-row .user-field {
            font-size: 13px;
            color: var(--dark-light);
        }

        .user-row .user-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .loading-text {
            text-align: center;
            padding: 40px 20px;
            color: var(--dark-light);
        }

        .loading-text i {
            font-size: 30px;
            color: var(--primary);
            margin-bottom: 10px;
            display: block;
        }

        .no-users {
            text-align: center;
            padding: 40px 20px;
            color: var(--dark-light);
        }

        .no-users i {
            font-size: 40px;
            color: var(--gray);
            margin-bottom: 12px;
            display: block;
        }

        /* ===== Maintenance Warning ===== */
        .maintenance-warning {
            background: rgba(253, 203, 110, 0.15);
            border: 1px solid rgba(253, 203, 110, 0.30);
            border-radius: var(--radius-sm);
            padding: 14px 20px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 12px;
            color: var(--dark);
            font-weight: 500;
        }

        .maintenance-warning i {
            color: var(--warning);
            font-size: 20px;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            top: 90px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            padding: 14px 22px;
            border-radius: var(--radius-sm);
            color: var(--white);
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            animation: slideInRight 0.4s ease forwards;
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 280px;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        .toast .toast-close {
            background: none;
            border: none;
            color: var(--white);
            cursor: pointer;
            font-size: 16px;
            margin-left: auto;
            opacity: 0.7;
            transition: var(--transition);
        }

        .toast .toast-close:hover {
            opacity: 1;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* ===== Responsive ===== */
        @media (max-width: 992px) {
            .sidebar-toggle {
                display: flex;
            }
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
            .user-row {
                grid-template-columns: 1fr;
                gap: 8px;
                padding: 14px 16px;
            }
            .user-row .user-actions {
                justify-content: flex-start;
                margin-top: 4px;
            }
        }

        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .page-actions {
                width: 100%;
                flex-direction: column;
            }
            .search-wrapper input {
                width: 100%;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            .header-left .brand h1 {
                font-size: 16px;
            }
            .card {
                padding: 16px;
            }
            .page-header .page-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="brand">
                    <i class="fas fa-crown"></i>
                    <h1>AdminHub</h1>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="badge">3</span>
                </button>
                <button class="btn-icon" title="Messages">
                    <i class="fas fa-envelope"></i>
                </button>
                <img src="logo.png" alt="Admin" class="avatar" title="Admin Profile" />
            </div>
        </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <ul class="sidebar-menu">
            <li class="menu-label">Main</li>
            <li class="sidebar-item">
                <a href="index.html" class="sidebar-link">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="admin.html" class="sidebar-link">
                    <i class="fas fa-user-plus"></i>
                    <span>Add User</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="dashboard.html" class="sidebar-link active">
                    <i class="fas fa-users-cog"></i>
                    <span>Manage Users</span>
                </a>
            </li>
            <li class="menu-label">System</li>
            <li class="sidebar-item">
                <a href="settings.html" class="sidebar-link">
                    <i class="fas fa-sliders-h"></i>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content" id="mainContent">
        <div class="container">

            <!-- Page Header -->
            <div class="page-header">
                <div>
                    <h1 class="page-title">
                        <i class="fas fa-users-cog"></i>
                        Manage Users
                    </h1>
                    <p class="page-subtitle">View, update, and manage all user accounts.</p>
                </div>
                <div class="page-actions">
                    <div class="search-wrapper">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search users..." oninput="filterUsers()" />
                    </div>
                    <a href="admin.html" class="btn btn-primary">
                        <i class="fas fa-user-plus"></i> Add User
                    </a>
                </div>
            </div>

            <!-- Maintenance Warning -->
            <div id="maintenanceWarning" class="maintenance-warning">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Site is currently in <strong>Maintenance Mode</strong>. User management is restricted.</span>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalUsers">0</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="activeUsers">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="inactiveUsers">0</div>
                    <div class="stat-label">Inactive</div>
                </div>
            </div>

            <!-- User List -->
            <div class="card">
                <div class="card-header">
                    <h2><i class="fas fa-list"></i> All Users</h2>
                    <span style="font-size:13px;color:var(--dark-light);" id="userCount">0 users</span>
                </div>
                <div id="userList" class="user-list">
                    <div class="loading-text">
                        <i class="fas fa-spinner fa-spin"></i>
                        Loading users...
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- ===== TOAST CONTAINER ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ===== SCRIPTS ===== -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

        // ---- Sidebar Toggle ----
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            mainContent.classList.toggle('shifted');
        });

        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 992) {
                const isSidebar = sidebar.contains(e.target);
                const isToggle = sidebarToggle.contains(e.target);
                if (!isSidebar && !isToggle && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    mainContent.classList.remove('shifted');
                }
            }
        });

        // ---- State ----
        let allUsers = {};
        let isMaintenance = false;

        // ---- DOM refs ----
        const userListEl = document.getElementById('userList');
        const totalUsersEl = document.getElementById('totalUsers');
        const activeUsersEl = document.getElementById('activeUsers');
        const inactiveUsersEl = document.getElementById('inactiveUsers');
        const userCountEl = document.getElementById('userCount');
        const maintenanceWarning = document.getElementById('maintenanceWarning');
        const toastContainer = document.getElementById('toastContainer');

        // ---- Maintenance Mode Check ----
        const settingsRef = ref(db, 'settings/appupdate');

        onValue(settingsRef, (snapshot) => {
            const settings = snapshot.val();
            isMaintenance = settings?.maintenanceMode === 'true';

            if (isMaintenance) {
                maintenanceWarning.style.display = 'flex';
            } else {
                maintenanceWarning.style.display = 'none';
            }

            // Still load users, but disable actions in maintenance
            loadUsers();
        });

        // ---- Load Users ----
        function loadUsers() {
            const usersRef = ref(db, "userinfo");

            onValue(usersRef, (snapshot) => {
                if (snapshot.exists()) {
                    allUsers = snapshot.val();
                    renderUsers(allUsers);
                    updateStats(allUsers);
                } else {
                    allUsers = {};
                    userListEl.innerHTML = `
                        <div class="no-users">
                            <i class="fas fa-user-slash"></i>
                            No users found
                        </div>
                    `;
                    updateStats({});
                }
            }, (error) => {
                userListEl.innerHTML = `
                    <div class="no-users">
                        <i class="fas fa-exclamation-circle" style="color:var(--danger);"></i>
                        Error loading users: ${error.message}
                    </div>
                `;
            });
        }

        // ---- Render Users ----
        function renderUsers(users) {
            const entries = Object.entries(users);

            if (entries.length === 0) {
                userListEl.innerHTML = `
                    <div class="no-users">
                        <i class="fas fa-user-slash"></i>
                        No users found
                    </div>
                `;
                userCountEl.textContent = '0 users';
                return;
            }

            userListEl.innerHTML = '';
            userCountEl.textContent = `${entries.length} users`;

            entries.forEach(([username, user]) => {
                const row = document.createElement('div');
                row.className = 'user-row';
                row.dataset.username = username;

                row.innerHTML = `
                    <div class="user-name">
                        <i class="fas fa-user-circle"></i>
                        ${username}
                    </div>
                    <div class="user-field">
                        <span class="user-status ${user.status}">${user.status}</span>
                    </div>
                    <div class="user-field">${user.validity || 'N/A'}</div>
                    <div class="user-field">${user.access === '∞' ? 'Unlimited' : '1 Device'}</div>
                    <div class="user-field">${user.rgtime || 'N/A'}</div>
                    <div class="user-actions">
                        <button class="btn btn-success btn-sm" onclick="window.updateUser('${username}')" ${isMaintenance ? 'disabled' : ''}>
                            <i class="fas fa-save"></i> Update
                        </button>
                        <button class="btn btn-danger btn-sm" onclick="window.deleteUser('${username}')" ${isMaintenance ? 'disabled' : ''}>
                            <i class="fas fa-trash"></i> Delete
                        </button>
                    </div>
                `;

                userListEl.appendChild(row);
            });
        }

        // ---- Update Stats ----
        function updateStats(users) {
            let total = 0;
            let active = 0;
            let inactive = 0;

            Object.values(users).forEach(user => {
                total++;
                if (user.status === 'active') active++;
                else inactive++;
            });

            totalUsersEl.textContent = total;
            activeUsersEl.textContent = active;
            inactiveUsersEl.textContent = inactive;
        }

        // ---- Filter Users ----
        window.filterUsers = function() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = {};

            for (let key in allUsers) {
                if (key.toLowerCase().includes(search)) {
                    filtered[key] = allUsers[key];
                }
            }

            renderUsers(filtered);
            updateStats(filtered);
        };

        // ---- Update User ----
        window.updateUser = function(username) {
            if (isMaintenance) {
                showToast('Cannot update user while in Maintenance Mode.', 'error');
                return;
            }

            // Find the row
            const rows = userListEl.querySelectorAll('.user-row');
            let row = null;
            rows.forEach(r => {
                if (r.dataset.username === username) row = r;
            });

            if (!row) {
                showToast('User not found.', 'error');
                return;
            }

            // Get current user data
            const user = allUsers[username];
            if (!user) {
                showToast('User data not found.', 'error');
                return;
            }

            // Show prompt for new password (optional)
            const newPassword = prompt(`Enter new password for "${username}" (leave empty to keep current):`);
            if (newPassword === null) return;

            // Show prompt for new status
            const newStatus = confirm(`Set "${username}" as active? Click OK for Active, Cancel for Inactive.`);
            const statusValue = newStatus ? 'active' : 'inactive';

            // Show prompt for validity
            const newValidity = prompt(`Enter new validity date for "${username}" (format: DD-MM-YYYY HH:MM) or leave empty to keep current:`, user.validity || '');
            if (newValidity === null) return;

            // Show prompt for access
            const accessChoice = confirm(`Set "${username}" to Unlimited Devices? Click OK for Unlimited, Cancel for 1 Device.`);
            const accessValue = accessChoice ? '∞' : '1';

            const updates = {
                status: statusValue,
                access: accessValue
            };

            if (newPassword.trim() !== '') {
                updates.password = newPassword.trim();
            }

            if (newValidity.trim() !== '') {
                updates.validity = newValidity.trim();
            }

            update(ref(db, `userinfo/${username}`), updates)
                .then(() => {
                    showToast(`✅ User "${username}" updated successfully!`, 'success');
                    // Update local data
                    allUsers[username] = { ...allUsers[username], ...updates };
                    renderUsers(allUsers);
                    updateStats(allUsers);
                })
                .catch((error) => {
                    showToast('❌ Error updating user: ' + error.message, 'error');
                });
        };

        // ---- Delete User ----
        window.deleteUser = function(username) {
            if (isMaintenance) {
                showToast('Cannot delete user while in Maintenance Mode.', 'error');
                return;
            }

            if (!confirm(`⚠️ Are you sure you want to delete "${username}"? This action cannot be undone.`)) {
                return;
            }

            remove(ref(db, `userinfo/${username}`))
                .then(() => {
                    showToast(`🗑️ User "${username}" deleted successfully!`, 'success');
                    delete allUsers[username];
                    renderUsers(allUsers);
                    updateStats(allUsers);
                })
                .catch((error) => {
                    showToast('❌ Error deleting user: ' + error.message, 'error');
                });
        };

        // ---- Toast System ----
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;
            toastContainer.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 4000);
        }

        // Make toast available globally
        window.showToast = showToast;
    </script>

</body>
</html>
