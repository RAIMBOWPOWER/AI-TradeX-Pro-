<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Add User | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== COPY SAME STYLES FROM INDEX.HTML ===== */
        :root {
            --primary: #6C5CE7;
            --primary-dark: #5A3FD9;
            --primary-light: #A29BFE;
            --primary-glow: rgba(108, 92, 231, 0.3);
            --secondary: #00D2D3;
            --secondary-light: #55EFC4;
            --secondary-glow: rgba(0, 210, 211, 0.3);
            --success: #00B894;
            --danger: #FF6B6B;
            --warning: #FDCB6E;
            --dark: #1a1a2e;
            --dark-card: #16213e;
            --gray: #b2bec3;
            --white: #ffffff;
            --bg: #0f0f1a;
            --card-bg: rgba(22, 33, 62, 0.85);
            --shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 20px 60px rgba(108, 92, 231, 0.25);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --border-glow: 1px solid rgba(108, 92, 231, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--white);
            line-height: 1.6;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(ellipse at 10% 20%, rgba(108, 92, 231, 0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 80%, rgba(0, 210, 211, 0.1) 0%, transparent 50%);
            z-index: -1;
            animation: bgPulse 10s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 10px;
        }

        .container { max-width: 1320px; margin: 0 auto; padding: 0 24px; }

        /* ===== HEADER ===== */
        .header {
            background: rgba(26, 26, 46, 0.85);
            backdrop-filter: blur(20px);
            padding: 12px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            border-bottom: var(--border-glow);
        }
        .header .container { display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 18px; }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .brand-icon {
            width: 44px; height: 44px; border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; color: var(--white);
            box-shadow: 0 0 30px var(--primary-glow);
            animation: iconPulse 3s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 0 30px var(--primary-glow); }
            50% { box-shadow: 0 0 60px var(--secondary-glow); }
        }
        .brand h1 {
            font-size: 22px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header-actions { display: flex; align-items: center; gap: 14px; }
        .btn-icon {
            width: 44px; height: 44px; border-radius: 50%;
            border: var(--border-glow); background: rgba(255,255,255,0.05);
            color: var(--gray); cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; font-size: 18px;
        }
        .btn-icon:hover { background: var(--primary); color: var(--white); transform: translateY(-2px); box-shadow: 0 0 30px var(--primary-glow); }
        .avatar {
            width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--primary); cursor: pointer; transition: var(--transition);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .avatar:hover { transform: scale(1.08) rotate(-5deg); border-color: var(--secondary); }
        .sidebar-toggle {
            display: none; width: 44px; height: 44px; border-radius: var(--radius-sm);
            border: var(--border-glow); background: rgba(255,255,255,0.05);
            color: var(--white); cursor: pointer; transition: var(--transition);
            align-items: center; justify-content: center; font-size: 20px;
        }
        .sidebar-toggle:hover { background: var(--primary); box-shadow: 0 0 30px var(--primary-glow); }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed; top: 72px; left: 0; bottom: 0; width: 270px;
            background: rgba(22, 33, 62, 0.92); backdrop-filter: blur(20px);
            border-right: var(--border-glow); padding: 20px 0;
            transition: var(--transition); z-index: 900; overflow-y: auto;
        }
        .sidebar-menu { list-style: none; padding: 0 14px; }
        .menu-label {
            font-size: 11px; font-weight: 700; color: var(--gray);
            text-transform: uppercase; letter-spacing: 1.5px;
            padding: 16px 14px 8px; opacity: 0.5;
        }
        .sidebar-item { margin-bottom: 2px; }
        .sidebar-link {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 16px; border-radius: var(--radius-sm);
            color: var(--gray); text-decoration: none;
            font-weight: 500; font-size: 14px;
            transition: var(--transition);
        }
        .sidebar-link i { width: 22px; font-size: 18px; text-align: center; }
        .sidebar-link:hover { background: rgba(108, 92, 231, 0.15); color: var(--white); transform: translateX(4px); }
        .sidebar-link.active {
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.2), rgba(0, 210, 211, 0.1));
            color: var(--white); font-weight: 600;
        }
        .sidebar-link.active::before {
            content: ''; position: absolute; left: 0; top: 8px; bottom: 8px;
            width: 4px; background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 0 4px 4px 0; box-shadow: 0 0 20px var(--primary-glow);
        }
        .sidebar-link .link-icon {
            width: 36px; height: 36px; border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            background: rgba(108, 92, 231, 0.1); transition: var(--transition);
        }
        .sidebar-link:hover .link-icon { background: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
        .sidebar-link .link-text { flex: 1; }
        .sidebar-link .link-badge {
            background: var(--secondary); color: var(--dark);
            font-size: 10px; font-weight: 700; padding: 2px 10px; border-radius: 20px;
        }

        /* ===== MAIN ===== */
        .main-content {
            margin-top: 72px; margin-left: 270px;
            padding: 30px 20px 60px;
            transition: var(--transition); min-height: 100vh;
        }

        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 32px; flex-wrap: wrap; gap: 16px;
        }
        .page-header h1 {
            font-size: 30px; font-weight: 800;
            display: flex; align-items: center; gap: 14px;
        }
        .page-header h1 i {
            color: var(--primary); background: rgba(108, 92, 231, 0.15);
            padding: 12px; border-radius: var(--radius-sm); font-size: 24px;
            box-shadow: 0 0 30px var(--primary-glow);
        }
        .page-header p { color: var(--gray); font-size: 15px; margin-left: 54px; }

        /* ===== CARD ===== */
        .card {
            background: var(--card-bg); backdrop-filter: blur(10px);
            border-radius: var(--radius); padding: 30px 34px;
            border: var(--border-glow); transition: var(--transition);
            max-width: 680px; margin: 0 auto;
        }
        .card:hover { border-color: var(--primary); box-shadow: var(--shadow-hover); }
        .card-title { font-size: 22px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 12px; }
        .card-title i { color: var(--primary); }
        .card-desc { color: var(--gray); font-size: 14px; margin-bottom: 24px; }

        /* ===== FORM ===== */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; color: var(--white); }
        .form-group label .required { color: var(--danger); margin-left: 2px; }
        .form-control {
            width: 100%; padding: 12px 16px;
            border: 2px solid rgba(255,255,255,0.08); border-radius: var(--radius-sm);
            font-size: 14px; font-family: 'Inter', sans-serif;
            transition: var(--transition); background: rgba(255,255,255,0.05);
            color: var(--white);
        }
        .form-control:focus {
            border-color: var(--primary); outline: none;
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 30px var(--primary-glow);
        }
        .form-control::placeholder { color: var(--gray); }

        .password-wrapper { position: relative; }
        .password-wrapper .toggle-pw {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--gray);
            cursor: pointer; font-size: 18px; padding: 4px;
            transition: var(--transition);
        }
        .password-wrapper .toggle-pw:hover { color: var(--primary); }

        .form-check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .form-check input[type="checkbox"] {
            width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer;
        }
        .form-check label { font-weight: 500; font-size: 14px; cursor: pointer; color: var(--white); }

        .radio-group { display: flex; gap: 24px; flex-wrap: wrap; }
        .radio-group .radio-item { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .radio-group .radio-item input[type="radio"] {
            width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer;
        }
        .radio-group .radio-item label { font-weight: 500; font-size: 14px; cursor: pointer; color: var(--white); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 10px; padding: 14px 28px; border-radius: var(--radius-sm);
            font-weight: 600; font-size: 15px; border: none;
            cursor: pointer; transition: var(--transition);
            font-family: 'Inter', sans-serif; width: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white); box-shadow: 0 0 30px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 0 50px var(--primary-glow); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .form-result {
            margin-top: 16px; padding: 12px 18px; border-radius: var(--radius-sm);
            font-weight: 500; font-size: 14px; text-align: center;
            display: none;
        }
        .form-result.success { display: block; background: rgba(0, 210, 211, 0.12); color: var(--secondary-light); border: 1px solid rgba(0, 210, 211, 0.2); }
        .form-result.error { display: block; background: rgba(255, 107, 107, 0.12); color: var(--danger); border: 1px solid rgba(255, 107, 107, 0.2); }

        .maintenance-warning {
            background: rgba(253, 203, 110, 0.12); border: 1px solid rgba(253, 203, 110, 0.2);
            border-radius: var(--radius-sm); padding: 14px 20px; margin-bottom: 24px;
            display: none; align-items: center; gap: 12px;
            color: var(--white); font-weight: 500;
        }
        .maintenance-warning i { color: var(--warning); font-size: 20px; }

        /* ===== TOAST ===== */
        #toastContainer {
            position: fixed; bottom: 30px; right: 30px;
            z-index: 9999; display: flex; flex-direction: column; gap: 12px;
        }
        .toast {
            padding: 14px 22px; border-radius: var(--radius-sm);
            color: var(--white); font-weight: 500; font-size: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: slideIn 0.4s ease forwards;
            display: flex; align-items: center; gap: 12px;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .sidebar-toggle { display: flex; }
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
        }
        @media (max-width: 600px) {
            .brand h1 { font-size: 17px; }
            .page-header h1 { font-size: 22px; }
            .card { padding: 20px; }
            .radio-group { flex-direction: column; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="index.html" class="brand">
                    <div class="brand-icon"><i class="fas fa-crown"></i></div>
                    <h1>AdminHub</h1>
                </a>
            </div>
            <div class="header-actions">
                <button class="btn-icon" title="Notifications">
                    <i class="fas fa-bell"></i>
                </button>
                <img src="logo.png" alt="Admin" class="avatar" />
            </div>
        </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <ul class="sidebar-menu">
            <li class="menu-label">Main Navigation</li>
            <li class="sidebar-item">
                <a href="index.html" class="sidebar-link">
                    <span class="link-icon"><i class="fas fa-chart-pie"></i></span>
                    <span class="link-text">Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="admin.html" class="sidebar-link active">
                    <span class="link-icon"><i class="fas fa-user-plus"></i></span>
                    <span class="link-text">Add User</span>
                    <span class="link-badge">New</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="dashboard.html" class="sidebar-link">
                    <span class="link-icon"><i class="fas fa-users-cog"></i></span>
                    <span class="link-text">Manage Users</span>
                </a>
            </li>
            <li class="menu-label">System</li>
            <li class="sidebar-item">
                <a href="settings.html" class="sidebar-link">
                    <span class="link-icon"><i class="fas fa-sliders-h"></i></span>
                    <span class="link-text">Settings</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- ===== MAIN ===== -->
    <main class="main-content" id="mainContent">
        <div class="container">

            <div class="page-header">
                <div>
                    <h1><i class="fas fa-user-plus"></i> Add New User</h1>
                    <p>Create a new user account with custom permissions.</p>
                </div>
            </div>

            <div id="maintenanceWarning" class="maintenance-warning">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Site is in <strong>Maintenance Mode</strong>. User additions are disabled.</span>
            </div>

            <div class="card">
                <h2 class="card-title"><i class="fas fa-user-circle"></i> User Details</h2>
                <p class="card-desc">Fill in the information below to create a new user.</p>

                <form id="addUserForm" novalidate>
                    <div class="form-group">
                        <label>Username <span class="required">*</span></label>
                        <input type="text" id="username" class="form-control" placeholder="Enter unique username" required />
                    </div>

                    <div class="form-group">
                        <label>Password <span class="required">*</span></label>
                        <div class="password-wrapper">
                            <input type="password" id="password" class="form-control" placeholder="Enter strong password" required />
                            <button type="button" class="toggle-pw" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Valid Until <span class="required">*</span></label>
                        <input type="datetime-local" id="validity" class="form-control" required />
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <div class="form-check">
                            <input type="checkbox" id="statusCheckbox" checked />
                            <label for="statusCheckbox">Active User</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Device Access</label>
                        <div class="radio-group">
                            <div class="radio-item">
                                <input type="radio" id="device1" name="access" value="1" checked />
                                <label for="device1">📱 1 Device</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="deviceUnlimited" name="access" value="∞" />
                                <label for="deviceUnlimited">🌐 Unlimited</label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-user-plus"></i> Create User
                    </button>

                    <div id="result" class="form-result"></div>
                </form>
            </div>

        </div>
    </main>

    <div id="toastContainer"></div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

        // ---- Sidebar ----
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            mainContent.classList.toggle('shifted');
        });
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 992) {
                const isSidebar = sidebar.contains(e.target);
                const isToggle = sidebarToggle.contains(e.target);
                if (!isSidebar && !isToggle && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    mainContent.classList.remove('shifted');
                }
            }
        });

        // ---- Toggle Password ----
        const togglePwBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        togglePwBtn.addEventListener('click', () => {
            const icon = togglePwBtn.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // ---- Maintenance ----
        const maintenanceWarning = document.getElementById('maintenanceWarning');
        const submitBtn = document.getElementById('submitBtn');
        const settingsRef = ref(db, 'settings/appupdate');
        onValue(settingsRef, (snapshot) => {
            const settings = snapshot.val();
            const inMaintenance = settings?.maintenanceMode === 'true';
            if (inMaintenance) {
                maintenanceWarning.style.display = 'flex';
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-lock"></i> Maintenance Mode Active';
            } else {
                maintenanceWarning.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create User';
            }
        });

        // ---- Add User ----
        const addUserForm = document.getElementById('addUserForm');
        const resultEl = document.getElementById('result');

        addUserForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const validity = document.getElementById('validity').value;
            const isActive = document.getElementById('statusCheckbox').checked;
            const access = document.querySelector('input[name="access"]:checked').value;

            if (!username || !password || !validity) {
                showResult('Please fill in all required fields.', 'error');
                return;
            }

            const date = new Date(validity);
            const pad = n => n.toString().padStart(2, '0');
            const formattedDate = `${pad(date.getDate())}-${pad(date.getMonth() + 1)}-${date.getFullYear()} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
            const now = new Date();
            const rgtime = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
            const status = isActive ? 'active' : 'inactive';

            const userRef = ref(db, `userinfo/${username}`);
            set(userRef, {
                username, password, status, validity: formattedDate,
                access, device: 'null', rgtime
            }).then(() => {
                showResult('✅ User created successfully!', 'success');
                addUserForm.reset();
                document.getElementById('statusCheckbox').checked = true;
                document.getElementById('device1').checked = true;
                passwordInput.type = 'password';
                togglePwBtn.querySelector('i').classList.remove('fa-eye-slash');
                togglePwBtn.querySelector('i').classList.add('fa-eye');
            }).catch((error) => {
                showResult('❌ Error: ' + error.message, 'error');
            });
        });

        function showResult(message, type) {
            resultEl.textContent = message;
            resultEl.className = `form-result ${type}`;
            setTimeout(() => {
                resultEl.textContent = '';
                resultEl.className = 'form-result';
            }, 4000);
        }

        // ---- Default validity ----
        const validityInput = document.getElementById('validity');
        const now = new Date();
        const oneWeekLater = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
        validityInput.value = oneWeekLater.toISOString().slice(0, 16);
    </script>

</body>
</html>
