<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Add User | Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== CSS Variables ===== */
        :root {
            --primary: #6C5CE7;
            --primary-dark: #5A4BD1;
            --primary-light: #A29BFE;
            --secondary: #00CEC9;
            --success: #00B894;
            --danger: #FF6B6B;
            --warning: #FDCB6E;
            --info: #74B9FF;
            --dark: #2D3436;
            --dark-light: #636E72;
            --gray: #B2BEC3;
            --light: #DFE6E9;
            --white: #FFFFFF;
            --bg: #F0F2F5;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 15px 40px rgba(108, 92, 231, 0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--dark);
            line-height: 1.6;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 10px; }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ===== Header ===== */
        .header {
            background: var(--white);
            padding: 14px 0;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.06);
        }

        .header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .header-left .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left .brand i {
            font-size: 28px;
            color: var(--primary);
            background: rgba(108, 92, 231, 0.12);
            padding: 8px;
            border-radius: var(--radius-sm);
        }

        .header-left .brand h1 {
            font-size: 20px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-actions .btn-icon {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--bg);
            color: var(--dark-light);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            position: relative;
        }

        .header-actions .btn-icon:hover {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-2px);
        }

        .header-actions .btn-icon .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 18px;
            height: 18px;
            background: var(--danger);
            color: var(--white);
            font-size: 10px;
            font-weight: 700;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-light);
            cursor: pointer;
            transition: var(--transition);
        }

        .avatar:hover {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        .sidebar-toggle {
            width: 42px;
            height: 42px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--bg);
            color: var(--dark);
            cursor: pointer;
            transition: var(--transition);
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .sidebar-toggle:hover {
            background: var(--primary);
            color: var(--white);
        }

        /* ===== Sidebar ===== */
        .sidebar {
            position: fixed;
            top: 74px;
            left: 0;
            bottom: 0;
            width: 260px;
            background: var(--white);
            box-shadow: 2px 0 20px rgba(0, 0, 0, 0.05);
            padding: 20px 0;
            transition: var(--transition);
            z-index: 900;
            overflow-y: auto;
        }

        .sidebar-menu {
            list-style: none;
            padding: 0 12px;
        }

        .sidebar-menu .menu-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding: 12px 14px 8px;
        }

        .sidebar-menu .sidebar-item {
            margin-bottom: 2px;
        }

        .sidebar-menu .sidebar-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            color: var(--dark-light);
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            transition: var(--transition);
            position: relative;
        }

        .sidebar-menu .sidebar-link i {
            width: 20px;
            font-size: 18px;
            text-align: center;
        }

        .sidebar-menu .sidebar-link:hover {
            background: rgba(108, 92, 231, 0.08);
            color: var(--primary);
        }

        .sidebar-menu .sidebar-link.active {
            background: linear-gradient(135deg, rgba(108, 92, 231, 0.12), rgba(0, 206, 201, 0.08));
            color: var(--primary);
            font-weight: 600;
        }

        .sidebar-menu .sidebar-link.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 4px;
            background: var(--primary);
            border-radius: 0 4px 4px 0;
        }

        /* ===== Main Content ===== */
        .main-content {
            margin-top: 74px;
            margin-left: 260px;
            padding: 30px 20px 60px;
            transition: var(--transition);
            min-height: 100vh;
        }

        /* ===== Page Header ===== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .page-header .page-title {
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .page-header .page-title i {
            color: var(--primary);
            background: rgba(108, 92, 231, 0.12);
            padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 22px;
        }

        .page-header .page-subtitle {
            color: var(--dark-light);
            font-size: 14px;
            font-weight: 400;
        }

        /* ===== Card ===== */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 28px 32px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0, 0, 0, 0.04);
            max-width: 680px;
            margin: 0 auto;
        }

        .card .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card .card-title i {
            color: var(--primary);
        }

        .card .card-desc {
            color: var(--dark-light);
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* ===== Form ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
            color: var(--dark);
        }

        .form-group label .required {
            color: var(--danger);
            margin-left: 2px;
        }

        .form-group .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--light);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: var(--transition);
            background: var(--bg);
            color: var(--dark);
        }

        .form-group .form-control:focus {
            border-color: var(--primary);
            outline: none;
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.10);
        }

        .form-group .form-control::placeholder {
            color: var(--gray);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: var(--transition);
        }

        .password-wrapper .toggle-pw:hover {
            color: var(--primary);
        }

        /* ===== Checkbox ===== */
        .form-check {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .form-check input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .form-check label {
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }

        /* ===== Radio Group ===== */
        .radio-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .radio-group .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-group .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .radio-group .radio-item label {
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
        }

        /* ===== Button ===== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white);
            width: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.35);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== Result Message ===== */
        .form-result {
            margin-top: 16px;
            padding: 12px 18px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 14px;
            text-align: center;
            display: none;
        }

        .form-result.success {
            display: block;
            background: rgba(0, 184, 148, 0.10);
            color: var(--success);
            border: 1px solid rgba(0, 184, 148, 0.20);
        }

        .form-result.error {
            display: block;
            background: rgba(255, 107, 107, 0.10);
            color: var(--danger);
            border: 1px solid rgba(255, 107, 107, 0.20);
        }

        /* ===== Maintenance Warning ===== */
        .maintenance-warning {
            background: rgba(253, 203, 110, 0.15);
            border: 1px solid rgba(253, 203, 110, 0.30);
            border-radius: var(--radius-sm);
            padding: 14px 20px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 12px;
            color: var(--dark);
            font-weight: 500;
        }

        .maintenance-warning i {
            color: var(--warning);
            font-size: 20px;
        }

        /* ===== Responsive ===== */
        @media (max-width: 992px) {
            .sidebar-toggle {
                display: flex;
            }
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
        }

        @media (max-width: 600px) {
            .header-left .brand h1 {
                font-size: 16px;
            }
            .card {
                padding: 20px;
            }
            .page-header .page-title {
                font-size: 20px;
            }
            .radio-group {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="brand">
                    <i class="fas fa-crown"></i>
                    <h1>AdminHub</h1>
                </div>
            </div>
            <div class="header-actions">
                <button class="btn-icon" title="Notifications">
                    <i class="fas fa-bell"></i>
                    <span class="badge">3</span>
                </button>
                <button class="btn-icon" title="Messages">
                    <i class="fas fa-envelope"></i>
                </button>
                <img src="logo.png" alt="Admin" class="avatar" title="Admin Profile" />
            </div>
        </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <ul class="sidebar-menu">
            <li class="menu-label">Main</li>
            <li class="sidebar-item">
                <a href="index.html" class="sidebar-link">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="admin.html" class="sidebar-link active">
                    <i class="fas fa-user-plus"></i>
                    <span>Add User</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="fas fa-users-cog"></i>
                    <span>Manage Users</span>
                </a>
            </li>
            <li class="menu-label">System</li>
            <li class="sidebar-item">
                <a href="settings.html" class="sidebar-link">
                    <i class="fas fa-sliders-h"></i>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="main-content" id="mainContent">
        <div class="container">

            <!-- Page Header -->
            <div class="page-header">
                <div>
                    <h1 class="page-title">
                        <i class="fas fa-user-plus"></i>
                        Add New User
                    </h1>
                    <p class="page-subtitle">Create a new user account with custom permissions.</p>
                </div>
            </div>

            <!-- Maintenance Warning -->
            <div id="maintenanceWarning" class="maintenance-warning">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Site is currently in <strong>Maintenance Mode</strong>. User additions might be affected.</span>
            </div>

            <!-- Form Card -->
            <div class="card">
                <h2 class="card-title"><i class="fas fa-user-circle"></i> User Details</h2>
                <p class="card-desc">Fill in the information below to create a new user.</p>

                <form id="addUserForm" novalidate>
                    <!-- Username -->
                    <div class="form-group">
                        <label>Username <span class="required">*</span></label>
                        <input type="text" id="username" class="form-control" placeholder="Enter unique username" required />
                    </div>

                    <!-- Password -->
                    <div class="form-group">
                        <label>Password <span class="required">*</span></label>
                        <div class="password-wrapper">
                            <input type="password" id="password" class="form-control" placeholder="Enter strong password" required />
                            <button type="button" class="toggle-pw" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Validity -->
                    <div class="form-group">
                        <label>Valid Until <span class="required">*</span></label>
                        <input type="datetime-local" id="validity" class="form-control" required />
                    </div>

                    <!-- Status -->
                    <div class="form-group">
                        <label>Status</label>
                        <div class="form-check">
                            <input type="checkbox" id="statusCheckbox" checked />
                            <label for="statusCheckbox">Active User</label>
                        </div>
                    </div>

                    <!-- Device Access -->
                    <div class="form-group">
                        <label>Device Access</label>
                        <div class="radio-group">
                            <div class="radio-item">
                                <input type="radio" id="device1" name="access" value="1" checked />
                                <label for="device1">📱 1 Device</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="deviceUnlimited" name="access" value="∞" />
                                <label for="deviceUnlimited">🌐 Unlimited Devices</label>
                            </div>
                        </div>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-user-plus"></i> Create User
                    </button>

                    <!-- Result -->
                    <div id="result" class="form-result"></div>
                </form>
            </div>

        </div>
    </main>

    <!-- ===== SCRIPTS ===== -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

        // ---- Sidebar Toggle ----
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('mainContent');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            mainContent.classList.toggle('shifted');
        });

        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 992) {
                const isSidebar = sidebar.contains(e.target);
                const isToggle = sidebarToggle.contains(e.target);
                if (!isSidebar && !isToggle && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    mainContent.classList.remove('shifted');
                }
            }
        });

        // ---- Toggle Password Visibility ----
        const togglePwBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');

        togglePwBtn.addEventListener('click', () => {
            const icon = togglePwBtn.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // ---- Maintenance Mode Check ----
        const maintenanceWarning = document.getElementById('maintenanceWarning');
        const submitBtn = document.getElementById('submitBtn');
        const settingsRef = ref(db, 'settings/appupdate');

        onValue(settingsRef, (snapshot) => {
            const settings = snapshot.val();
            const inMaintenance = settings?.maintenanceMode === 'true';

            if (inMaintenance) {
                maintenanceWarning.style.display = 'flex';
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-lock"></i> Maintenance Mode Active';
            } else {
                maintenanceWarning.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create User';
            }
        });

        // ---- Add User Form ----
        const addUserForm = document.getElementById('addUserForm');
        const resultEl = document.getElementById('result');

        addUserForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const validity = document.getElementById('validity').value;
            const isActive = document.getElementById('statusCheckbox').checked;
            const access = document.querySelector('input[name="access"]:checked').value;

            if (!username || !password || !validity) {
                showResult('Please fill in all required fields.', 'error');
                return;
            }

            // Format date
            const date = new Date(validity);
            const pad = n => n.toString().padStart(2, '0');
            const formattedDate = `${pad(date.getDate())}-${pad(date.getMonth() + 1)}-${date.getFullYear()} ${pad(date.getHours())}:${pad(date.getMinutes())}`;

            const now = new Date();
            const rgtime = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;

            const status = isActive ? 'active' : 'inactive';

            const userRef = ref(db, `userinfo/${username}`);

            set(userRef, {
                username: username,
                password: password,
                status: status,
                validity: formattedDate,
                access: access,
                device: 'null',
                rgtime: rgtime
            })
            .then(() => {
                showResult('✅ User created successfully!', 'success');
                addUserForm.reset();
                // Reset checkbox to checked
                document.getElementById('statusCheckbox').checked = true;
                // Reset radio to first option
                document.getElementById('device1').checked = true;
                // Reset password toggle icon
                const icon = togglePwBtn.querySelector('i');
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                passwordInput.type = 'password';
            })
            .catch((error) => {
                showResult('❌ Error: ' + error.message, 'error');
            });
        });

        function showResult(message, type) {
            resultEl.textContent = message;
            resultEl.className = `form-result ${type}`;
            setTimeout(() => {
                resultEl.textContent = '';
                resultEl.className = 'form-result';
            }, 4000);
        }

        // ---- Set default validity to 1 week from now ----
        const validityInput = document.getElementById('validity');
        const now = new Date();
        const oneWeekLater = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
        validityInput.value = oneWeekLater.toISOString().slice(0, 16);
    </script>

</body>
</html>
