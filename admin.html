<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add User | AdminPro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* ===== SAME STYLES AS INDEX ===== */
        :root {
            --primary: #6C5CE7; --primary-dark: #5A3FD9; --primary-light: #A29BFE;
            --primary-glow: rgba(108,92,231,0.25);
            --secondary: #00D2D3; --secondary-light: #55EFC4;
            --success: #00B894; --danger: #FF6B6B; --warning: #FDCB6E;
            --dark: #0a0a1a; --dark-card: #12122a; --bg: #080816;
            --gray: #6c7a89; --gray-light: #a0aec0; --white: #ffffff;
            --radius: 16px; --radius-sm: 10px; --radius-xs: 6px;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --shadow-glow: 0 8px 32px rgba(108,92,231,0.2);
            --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            --border-glow: 1px solid rgba(108,92,231,0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
        }
        body::before {
            content: ''; position: fixed; inset: 0;
            background: radial-gradient(ellipse at 20% 30%, rgba(108,92,231,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 70%, rgba(0,210,211,0.06) 0%, transparent 50%);
            z-index: -1;
            animation: bgFloat 15s ease-in-out infinite alternate;
        }
        @keyframes bgFloat {
            0% { transform: scale(1) rotate(0deg); opacity: 0.6; }
            100% { transform: scale(1.05) rotate(2deg); opacity: 1; }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        .container { max-width: 1280px; margin: 0 auto; padding: 0 20px; }

        /* HEADER */
        .header {
            background: rgba(10,10,26,0.92); backdrop-filter: blur(16px);
            padding: 12px 0; position: fixed; top: 0; left: 0; right: 0;
            z-index: 1000; border-bottom: var(--border-glow);
        }
        .header .container { display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .sidebar-toggle {
            width: 40px; height: 40px; border-radius: var(--radius-xs);
            border: none; background: rgba(255,255,255,0.04);
            color: var(--white); cursor: pointer; transition: var(--transition);
            font-size: 18px; display: flex; align-items: center; justify-content: center;
        }
        .sidebar-toggle:hover { background: var(--primary); box-shadow: 0 0 20px var(--primary-glow); }
        .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand-icon {
            width: 40px; height: 40px; border-radius: var(--radius-xs);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: var(--white);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .brand h1 {
            font-size: 18px; font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary-light));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header-actions { display: flex; align-items: center; gap: 12px; }
        .btn-icon {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.04); color: var(--gray-light);
            cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .btn-icon:hover { background: var(--primary); color: var(--white); transform: scale(1.05); }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--primary); cursor: pointer; transition: var(--transition);
        }
        .avatar:hover { transform: scale(1.06); border-color: var(--secondary); }

        /* SIDEBAR */
        .sidebar {
            position: fixed; top: 64px; left: 0; bottom: 0; width: 240px;
            background: rgba(10,10,26,0.94); backdrop-filter: blur(16px);
            border-right: var(--border-glow); padding: 16px 0;
            transition: var(--transition); z-index: 900; overflow-y: auto;
        }
        .sidebar.closed { transform: translateX(-100%); }
        .sidebar-menu { list-style: none; padding: 0 12px; }
        .menu-label {
            font-size: 10px; font-weight: 700; color: var(--gray);
            text-transform: uppercase; letter-spacing: 1px;
            padding: 12px 14px 6px; opacity: 0.5;
        }
        .sidebar-item { margin-bottom: 2px; }
        .sidebar-link {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; border-radius: var(--radius-xs);
            color: var(--gray-light); text-decoration: none;
            font-weight: 500; font-size: 13px;
            transition: var(--transition); position: relative;
        }
        .sidebar-link i { width: 20px; font-size: 16px; text-align: center; }
        .sidebar-link:hover { background: rgba(108,92,231,0.08); color: var(--white); }
        .sidebar-link.active {
            background: rgba(108,92,231,0.12); color: var(--white); font-weight: 600;
        }
        .sidebar-link.active::before {
            content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
            width: 3px; background: var(--primary); border-radius: 0 3px 3px 0;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .sidebar-link .link-badge {
            background: var(--secondary); color: var(--dark);
            font-size: 9px; font-weight: 700; padding: 1px 10px; border-radius: 20px;
            margin-left: auto;
        }

        /* MAIN */
        .main-content {
            margin-top: 64px; margin-left: 240px;
            padding: 24px 20px 60px;
            transition: var(--transition); min-height: 100vh;
        }
        .main-content.expanded { margin-left: 0; }

        .page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
        }
        .page-header h1 {
            font-size: 24px; font-weight: 800;
            display: flex; align-items: center; gap: 12px;
        }
        .page-header h1 i {
            color: var(--primary); background: rgba(108,92,231,0.1);
            padding: 10px; border-radius: var(--radius-xs); font-size: 18px;
        }
        .page-header p { color: var(--gray); font-size: 13px; margin-left: 48px; }

        /* CARD */
        .card {
            background: var(--dark-card); border-radius: var(--radius-sm);
            padding: 24px 28px; border: var(--border-glow);
            transition: var(--transition); max-width: 520px; margin: 0 auto;
        }
        .card:hover { border-color: rgba(108,92,231,0.2); }
        .card-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 10px; }
        .card-title i { color: var(--primary); }
        .card-desc { color: var(--gray); font-size: 13px; margin-bottom: 20px; }

        /* FORM */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; color: var(--white); }
        .form-group label .required { color: var(--danger); margin-left: 2px; }
        .form-control {
            width: 100%; padding: 10px 14px;
            border: 1px solid rgba(255,255,255,0.06); border-radius: var(--radius-xs);
            font-size: 13px; font-family: 'Inter', sans-serif;
            transition: var(--transition); background: rgba(255,255,255,0.03);
            color: var(--white);
        }
        .form-control:focus {
            border-color: var(--primary); outline: none;
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .form-control::placeholder { color: var(--gray); }

        .password-wrapper { position: relative; }
        .password-wrapper .toggle-pw {
            position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--gray);
            cursor: pointer; font-size: 16px; padding: 4px;
            transition: var(--transition);
        }
        .password-wrapper .toggle-pw:hover { color: var(--primary); }

        .form-check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .form-check input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer;
        }
        .form-check label { font-weight: 500; font-size: 13px; cursor: pointer; color: var(--white); }

        .radio-group { display: flex; gap: 20px; flex-wrap: wrap; }
        .radio-group .radio-item { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .radio-group .radio-item input[type="radio"] {
            width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer;
        }
        .radio-group .radio-item label { font-weight: 500; font-size: 13px; cursor: pointer; color: var(--white); }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 8px; padding: 10px 20px; border-radius: var(--radius-xs);
            font-weight: 600; font-size: 13px; border: none;
            cursor: pointer; transition: var(--transition);
            font-family: 'Inter', sans-serif; width: 100%;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--white); box-shadow: 0 0 20px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px var(--primary-glow); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .form-result {
            margin-top: 14px; padding: 10px 16px; border-radius: var(--radius-xs);
            font-weight: 500; font-size: 13px; text-align: center;
            display: none;
        }
        .form-result.success { display: block; background: rgba(0,210,211,0.1); color: var(--secondary-light); border: 1px solid rgba(0,210,211,0.15); }
        .form-result.error { display: block; background: rgba(255,107,107,0.1); color: var(--danger); border: 1px solid rgba(255,107,107,0.15); }

        .maintenance-warning {
            background: rgba(253,203,110,0.08); border: 1px solid rgba(253,203,110,0.12);
            border-radius: var(--radius-xs); padding: 10px 16px; margin-bottom: 16px;
            display: none; align-items: center; gap: 10px;
            color: var(--white); font-weight: 500; font-size: 13px;
        }
        .maintenance-warning i { color: var(--warning); font-size: 16px; }

        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 940; display: none; backdrop-filter: blur(4px);
        }
        .overlay.open { display: block; }

        /* TOAST */
        #toastContainer {
            position: fixed; bottom: 20px; right: 20px;
            z-index: 9999; display: flex; flex-direction: column; gap: 10px;
            max-width: 360px; width: 100%;
        }
        .toast {
            padding: 12px 18px; border-radius: var(--radius-xs);
            color: var(--white); font-weight: 500; font-size: 13px;
            box-shadow: var(--shadow); animation: slideUp 0.3s ease forwards;
            display: flex; align-items: center; gap: 12px;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); color: var(--dark); }
        .toast.info { background: var(--primary); }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 992px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
        }
        @media (max-width: 600px) {
            .brand h1 { font-size: 15px; }
            .brand-icon { width: 34px; height: 34px; font-size: 15px; }
            .page-header h1 { font-size: 19px; }
            .card { padding: 16px 18px; }
            .radio-group { flex-direction: column; gap: 8px; }
            .header-actions .btn-icon:not(.avatar):not(.sidebar-toggle) { display: none; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="container">
            <div class="header-left">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <a href="index.html" class="brand">
                    <div class="brand-icon"><i class="fas fa-crown"></i></div>
                    <h1>AdminPro</h1>
                </a>
            </div>
            <div class="header-actions">
                <button class="btn-icon" onclick="window.location.href='index.html'">
                    <i class="fas fa-home"></i>
                </button>
                <img src="logo.png" alt="Admin" class="avatar" />
            </div>
        </div>
    </header>

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
        <ul class="sidebar-menu">
            <li class="menu-label">Main Menu</li>
            <li class="sidebar-item">
                <a href="index.html" class="sidebar-link">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="admin.html" class="sidebar-link active">
                    <i class="fas fa-user-plus"></i>
                    <span>Add User</span>
                    <span class="link-badge">+</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a href="dashboard.html" class="sidebar-link">
                    <i class="fas fa-users-cog"></i>
                    <span>Manage Users</span>
                </a>
            </li>
            <li class="menu-label">System</li>
            <li class="sidebar-item">
                <a href="settings.html" class="sidebar-link">
                    <i class="fas fa-sliders-h"></i>
                    <span>Settings</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- ===== OVERLAY ===== -->
    <div class="overlay" id="overlay"></div>

    <!-- ===== MAIN ===== -->
    <main class="main-content" id="mainContent">
        <div class="container">

            <div class="page-header">
                <div>
                    <h1><i class="fas fa-user-plus"></i> Add User</h1>
                    <p>Create a new user account</p>
                </div>
            </div>

            <div id="maintenanceWarning" class="maintenance-warning">
                <i class="fas fa-exclamation-triangle"></i>
                <span>Maintenance mode active. User additions disabled.</span>
            </div>

            <div class="card">
                <h2 class="card-title"><i class="fas fa-user-circle"></i> User Details</h2>
                <p class="card-desc">Fill in the information below.</p>

                <form id="addUserForm" novalidate>
                    <div class="form-group">
                        <label>Username <span class="required">*</span></label>
                        <input type="text" id="username" class="form-control" placeholder="Enter username" required />
                    </div>

                    <div class="form-group">
                        <label>Password <span class="required">*</span></label>
                        <div class="password-wrapper">
                            <input type="password" id="password" class="form-control" placeholder="Enter password" required />
                            <button type="button" class="toggle-pw" id="togglePassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Valid Until <span class="required">*</span></label>
                        <input type="datetime-local" id="validity" class="form-control" required />
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <div class="form-check">
                            <input type="checkbox" id="statusCheckbox" checked />
                            <label for="statusCheckbox">Active User</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Device Access</label>
                        <div class="radio-group">
                            <div class="radio-item">
                                <input type="radio" id="device1" name="access" value="1" checked />
                                <label for="device1">📱 1 Device</label>
                            </div>
                            <div class="radio-item">
                                <input type="radio" id="deviceUnlimited" name="access" value="∞" />
                                <label for="deviceUnlimited">🌐 Unlimited</label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        <i class="fas fa-user-plus"></i> Create User
                    </button>

                    <div id="result" class="form-result"></div>
                </form>
            </div>

        </div>
    </main>

    <div id="toastContainer"></div>

    <!-- ============================================================
    SCRIPT
    ============================================================ -->
    <script type="module">
        import { db } from "./firebase-config.js";
        import { ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js";

        // ---- Sidebar ----
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
        });
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
        });

        // ---- Toast ----
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span>${message}</span>
                <button onclick="this.parentElement.remove()" style="background:none;border:none;color:inherit;cursor:pointer;font-size:16px;opacity:0.7;margin-left:auto;">✕</button>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }
        window.showToast = showToast;

        // ---- Toggle Password ----
        const togglePwBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        togglePwBtn.addEventListener('click', () => {
            const icon = togglePwBtn.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // ---- Maintenance ----
        const maintenanceWarning = document.getElementById('maintenanceWarning');
        const submitBtn = document.getElementById('submitBtn');
        const settingsRef = ref(db, 'settings/appupdate');
        onValue(settingsRef, (snapshot) => {
            const settings = snapshot.val();
            const inMaintenance = settings?.maintenanceMode === 'true';
            if (inMaintenance) {
                maintenanceWarning.style.display = 'flex';
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-lock"></i> Maintenance Active';
            } else {
                maintenanceWarning.style.display = 'none';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create User';
            }
        });

        // ---- Add User ----
        const addUserForm = document.getElementById('addUserForm');
        const resultEl = document.getElementById('result');

        addUserForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const validity = document.getElementById('validity').value;
            const isActive = document.getElementById('statusCheckbox').checked;
            const access = document.querySelector('input[name="access"]:checked').value;

            if (!username || !password || !validity) {
                showResult('Please fill all required fields.', 'error');
                showToast('❌ Please fill all fields', 'error');
                return;
            }

            const date = new Date(validity);
            const pad = n => n.toString().padStart(2, '0');
            const formattedDate = `${pad(date.getDate())}-${pad(date.getMonth() + 1)}-${date.getFullYear()} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
            const now = new Date();
            const rgtime = `${pad(now.getDate())}-${pad(now.getMonth() + 1)}-${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
            const status = isActive ? 'active' : 'inactive';

            const userRef = ref(db, `userinfo/${username}`);
            set(userRef, {
                username, password, status, validity: formattedDate,
                access, device: 'null', rgtime
            }).then(() => {
                showResult('✅ User created successfully!', 'success');
                showToast('✅ User created successfully!', 'success');
                addUserForm.reset();
                document.getElementById('statusCheckbox').checked = true;
                document.getElementById('device1').checked = true;
                passwordInput.type = 'password';
                togglePwBtn.querySelector('i').classList.remove('fa-eye-slash');
                togglePwBtn.querySelector('i').classList.add('fa-eye');
            }).catch((error) => {
                showResult('❌ Error: ' + error.message, 'error');
                showToast('❌ Error: ' + error.message, 'error');
            });
        });

        function showResult(message, type) {
            resultEl.textContent = message;
            resultEl.className = `form-result ${type}`;
            setTimeout(() => {
                resultEl.textContent = '';
                resultEl.className = 'form-result';
            }, 4000);
        }

        // ---- Default validity ----
        const validityInput = document.getElementById('validity');
        const now = new Date();
        const oneWeekLater = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);
        validityInput.value = oneWeekLater.toISOString().slice(0, 16);
    </script>

</body>
</html>
